 
# General Experiment
PROJECT: "Seaquest-Subpolicies-Tests"
ENTITY: ""
WANDB_MODE: "online" # or "disabled"
ALG_NAME: "PQN"
ENV_NAME: "Seaquest"
SEED: 0
NUM_SEEDS: 1
SAVE_PATH: "./checkpoints"

# Sub-Policy Selection
# Options: "collect", "destroy", "avoid"
SUB_POLICY_TASK: "destroy"

# Training Hyperparameters
TOTAL_TIMESTEPS: 10_000_000
TOTAL_TIMESTEPS_DECAY: 10_000_000
NUM_ENVS: 128         # Parallel environments
NUM_STEPS: 128        # Steps per environment per update
NUM_MINIBATCHES: 4
NUM_EPOCHS: 4
LR: 2.5e-4
LR_LINEAR_DECAY: True
MAX_GRAD_NORM: 0.5
GAMMA: 0.99
LAMBDA: 0.95

# Exploration
EPS_START: 1.0
EPS_FINISH: 0.05
EPS_DECAY: 0.5 # Fraction of training to decay over
EPS_TEST: 0.01

# Evaluation
TEST_DURING_TRAINING: True
TEST_INTERVAL: 1.0   # Test only once
TEST_NUM_ENVS: 32
TEST_NUM_STEPS: 1800   # Length of test episode
TEST_MODIFS: False
RECORD_VIDEO: True

# Architecture
NORM_TYPE: "layer_norm"
NORM_INPUT: False

# Atari Specifics
STICKY_ACTIONS: True
EPISODIC_LIFE: True

# Seaquest Wrapper Config (Defaults required by Wrapper)
environment:
  screen_width: 160
  screen_height: 210
  max_objs: 34
  n_global_feats: 10
  n_obj_feats: 5 # x, y, w, h, active

concepts:
  label_high_level_concept: 2 # Number of class bits/concepts # TODO: should be removed from the entire workflow
