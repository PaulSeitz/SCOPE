# --- Experiment Meta Data ---
PROJECT: "Seaquest-Meta-Hierarchical"
ENTITY: ""  # Your WandB entity
WANDB_MODE: "online" # TODO: change once it compiles
ENV_NAME: "Seaquest"
ALG_NAME: "PQN_Meta"     # Name for this experiment
SUB_ALG_NAME: "PQN"      # Name used when you trained the skills (to find files)
SEED: 0
NUM_SEEDS: 1

# --- Save/Load Paths ---
# This is where the script will look for your pre-trained skills.
# It expects folders like: ./checkpoints/PQN_Seaquest_collect/...
SAVE_PATH: "./checkpoints"
SUBPOLICY_PATH: "./checkpoints"

# --- Hierarchy Control ---
FREEZE_SKILLS: False      # TRUE = Skills are static. FALSE = Skills update/fine-tune.
META_ARCH: "mlp"         # Options: "mlp", "transformer"

# --- Training Hyperparameters ---
# Generally, Meta-Policies need fewer steps than raw pixels because the abstraction is efficient.
TOTAL_TIMESTEPS: 50_000_000
NUM_ENVS: 512            
NUM_STEPS: 128
NUM_MINIBATCHES: 4
NUM_EPOCHS: 4
LR: 2.5e-4
LR_LINEAR_DECAY: True
MAX_GRAD_NORM: 0.5
GAMMA: 0.99
LAMBDA: 0.95

# --- Exploration ---
# Epsilon Greedy for the Meta-Choice (Which object to pick?)
EPS_START: 1.0
EPS_FINISH: 0.05
EPS_DECAY: 0.5

# --- Environment Config ---
# Must match exactly what the Skills were trained with!
STICKY_ACTIONS: True
EPISODIC_LIFE: True

environment:
  screen_width: 160
  screen_height: 210
  max_objs: 35
  n_global_feats: 10
  n_obj_feats: 5

concepts:
  label_high_level_concept: 3

# --- Architecture Specs ---
NORM_TYPE: "layer_norm"
NORM_INPUT: False

# Meta Specifics
META_ACTION_DIM: 35      # 0-34 Objects
SKILLS_ACTION_DIM: 18    # Joystick Actions
HIDDEN_SIZE: 128          # For the MLP parts
NUM_LAYERS: 4

TEST_DURING_TRAINING: True
TEST_INTERVAL: 1.0    # Evaluate twice every of training
TEST_NUM_ENVS: 16      # Number of envs for evaluation
TEST_NUM_STEPS: 1000    # Length of evaluation episode
EPS_TEST: 0.01         # Epsilon for evaluation
RECORD_VIDEO: True     # Needed to trigger the video callback
