# Example WandB Sweep Configuration
# Usage: wandb sweep wandb_sweep_example.yaml

program: src/train.py
method: bayes  # Options: grid, random, bayes
metric:
  name: train/episode_reward
  goal: maximize
parameters:
  # Model hyperparameters
  model.hidden_dims:
    values:
      - [64, 64]
      - [128, 64]
      - [128, 128]
      - [256, 128]
  
  # Training hyperparameters
  training.sub_policy_lr:
    distribution: log_uniform
    min: 1e-5
    max: 1e-2
  
  training.gamma:
    distribution: uniform
    min: 0.9
    max: 0.999
  
  training.epsilon_start:
    distribution: uniform
    min: 0.5
    max: 1.0
  
  training.epsilon_end:
    distribution: uniform
    min: 0.01
    max: 0.1
  
  training.batch_size:
    values: [16, 32, 64, 128]
  
  # Reward hyperparameters
  reward.reward_scale:
    distribution: uniform
    min: 1.0
    max: 20.0
  
  reward.bonus_success:
    distribution: uniform
    min: 0.5
    max: 2.0
  
  reward.aim_bonus_scale:
    distribution: log_uniform
    min: 0.01
    max: 0.5
