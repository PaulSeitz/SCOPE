# Example config for forced concept training mode
# This config forces the COLLECT concept (concept_id=0) for 10 million steps
# Only the sub-policy for COLLECT will be trained (meta and selector are frozen)

model:
  hidden_dims: [64, 64]
  selector_hidden_dims: [64, 64]

training:
  seed: 42
  
  # Learning Rates
  sub_policy_lr: 0.0001
  meta_policy_lr: 0.0001
  selector_lr: 0.0001
  
  # Hysteresis / Stickiness
  meta_stickiness: 0.0
  selector_stickiness: 0.2
  
  # Q-Learning Params
  gamma: 0.99
  tau: 0.00001
  
  # Epsilon schedule
  epsilon_start: 1.0
  epsilon_end: 0.02
  
  # PQN-specific hyperparameters
  rollout_len: 64  # Steps per update loop (NUM_STEPS in PQN)
  num_minibatches: 128  # Number of minibatches per epoch (PQN convention)
  epochs: 4  # Number of epochs (NUM_EPOCHS in PQN)
  
  # Duration: 10 million steps for forced concept training
  total_steps: 10_000_000
  
  # Parallel environments
  num_envs: 512
  
  # Phased training (these are ignored when force_concept_mode is enabled)
  phase_1_steps: 40_000_000
  phase_2_steps: 80_000_000
  
  # FORCED CONCEPT MODE: Force COLLECT (concept_id=0) for entire training
  # Concept IDs: 0=COLLECT, 1=AVOID, 2=DESTROY, 3=DEFAULT
  force_concept_mode: true
  force_concept_id: 0  # COLLECT

reward:
  global_score_scale: 1.0
  bonus_success: 5.0
  reward_scale: 1.0
  aim_bonus_scale: 1.0
  penalty_failure: -5.0

environment:
  game_name: "seaquest"
  game_mods: ["disable_surfacing_death"]
  frame_stack_size: 4
  frame_skip: 4
  sticky_actions: true
  episodic_life: true
  first_fire: false
  noop_reset: 30
  clip_reward: false
  max_pooling: false
  screen_width: 160.0
  screen_height: 210.0
  max_objs: 34
  n_global_feats: 10
  n_obj_feats: 4
  n_actions: 18

concepts:
  label_high_level_concept: 3
  n_capabilities: 4

wandb:
  project: "concept-transfer-rl"
  name: "forced-collect-10M"
  mode: "online"
  log_interval: 10
