model:
  hidden_dims: [64, 64]
  selector_hidden_dims: [64, 64]

training:
  seed: 42
  
  # Learning Rates (Reduced for stability in Debug Run)
  sub_policy_lr: 0.0001
  meta_policy_lr: 0.0001
  selector_lr: 0.0001
  
  # Hysteresis / Stickiness
  meta_stickiness: 0.0     # Reduced to 0.0 - don't encourage staying on Default
  selector_stickiness: 0.2
  
  # Q-Learning Params
  gamma: 0.99
  
  # Tau must be tiny to maintain stability over a lot of updates.
  tau: 0.00001
  
  # CRITICAL FIX: EPSILON
  # We want Epsilon to hit 0.1 by the end of Phase 1 (20M steps)
  # so the Selector/Meta have a competent Sub-Policy to work with.
  # The decay is calculated as: current_eps = max(end, start - progress * decay_rate)
  # Modified in train.py to decay over first 20% of training (finish decay by 20M steps)
  epsilon_start: 1.0
  epsilon_end: 0.02
  
  # Loop Params
  # Increase batch size to stabilize gradients across 1024 environments
  batch_size: 256  # number of samples to update the policy
  
  # PQN-specific hyperparameters
  rollout_len: 64  # Steps per update loop
  epochs: 4  # Reduced from 3 to prevent overfitting to the rollout buffer
  
  # Duration
  total_steps: 40_000_000
  
  # Parallel environments for vectorization (performance optimization)
  num_envs: 512
  
  # Phased training: freeze parts of the network for certain steps
  # Phase 1 (0 to phase_1_steps): Only Sub-Policy trains
  # Phase 2 (phase_1_steps to phase_2_steps): Sub-Policy + Selector train
  # Phase 3 (after phase_2_steps): All components train
  phase_1_steps: 40_000_000  # Steps until selector starts training
  phase_2_steps: 80_000_000  # Steps until meta-policy starts training
  
  # Forced concept training mode: permanently force one concept and only train that
  # When enabled, the agent will always select the specified concept regardless of phase
  # Only the sub-policy for that concept will be trained (meta and selector are frozen)
  # Set force_concept_id to: 0=COLLECT, 1=AVOID, 2=DESTROY, 3=DEFAULT
  force_concept_mode: false  # Set to true to enable forced concept training
  force_concept_id: null  # Concept ID to force (0=COLLECT, 1=AVOID, 2=DESTROY, 3=DEFAULT)

reward:
  # 1. The Global Master (Keep High)
  # Seaquest gives 20-100 points. Keep this at 1.0 to generate signals of 20.0 - 100.0
  global_score_scale: 1.0

  # 2. Local Success (The Bridge)
  # Collecting a diver should feel good (5.0), but SCORING (Global) should feel better (20.0+)
  # This encourages the agent to "Finish the Job" (Surface) rather than just hoard divers.
  bonus_success: 5.0     # Reduced from 10.0 - bridge between shaping and global

  # 3. Shaping (The Breadcrumbs)
  # Signals must be comparable. 
  # Shaping (0.5) vs Success (5.0) vs Death (-5.0) is a healthy ratio.
  # Increased from 0.001 to 1.0 so the agent actually feels the "Pull"
  reward_scale: 1.0
  aim_bonus_scale: 1.0

  # 4. Failure (The Slap)
  # Death is bad, but it shouldn't be -50 (which scares the agent into a corner).
  # -5.0 is enough to outweigh the Local Success of one diver.
  penalty_failure: -5.0

environment:
  game_name: "seaquest"
  game_mods: ["disable_surfacing_death"]
  frame_stack_size: 4
  frame_skip: 4
  sticky_actions: true
  episodic_life: true
  first_fire: false
  noop_reset: 30
  clip_reward: false
  max_pooling: false
  screen_width: 160.0
  screen_height: 210.0
  max_objs: 34  # Reduced from 35 (Removed Player Missile from object list)
  n_global_feats: 10
  n_obj_feats: 4
  n_actions: 18

concepts:
  label_high_level_concept: 3  # Monitor / Surface
  n_capabilities: 4

wandb:
  project: "concept-transfer-rl"
  name: "pqn-seaquest-512envs"
  mode: "online"  # Set to "offline" for testing, "online" for production
  log_interval: 10
