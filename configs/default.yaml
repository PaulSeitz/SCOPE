model:
  hidden_dims: [64, 64]
  selector_hidden_dims: [64, 64]
  # Normalization (PQN parameters)
  norm_input: false  # Whether to normalize inputs (PQN parameter)
  norm_type: "layer_norm"  # Normalization type: "layer_norm" or "batch_norm" (PQN parameter)

training:
  seed: 42
  
  # Learning Rates (High-throughput: aggressive for stable 1024-env signal)
  sub_policy_lr: 0.0005
  meta_policy_lr: 0.0005
  selector_lr: 0.0005
  
  # Hysteresis / Stickiness
  meta_stickiness: 0.0     # Reduced to 0.0 - don't encourage staying on Default
  selector_stickiness: 0.2
  
  # Q-Learning Params
  gamma: 0.99
  lambda_: 0.65  # Q(lambda) return parameter (PQN parameter, blends multi-step returns)
  
  epsilon_start: 1.0
  epsilon_end: 0.01  # Lower epsilon_end for high-throughput (enough samples to risk exploration)
  epsilon_decay: 0.1  # Epsilon decay rate (PQN parameter, used if custom schedules disabled)
  
  # Gradient clipping (PQN parameter)
  max_grad_norm: 5.0  # Tighter clip because 1024 envs can sum to huge gradients
  
  # Learning rate decay (PQN parameter)
  lr_linear_decay: false  # Whether to linearly decay learning rate over training
  
  # PQN-specific hyperparameters (High-throughput defaults for 1024 envs)
  rollout_len: 32  # Steps per update loop - shorter for more frequent updates
  num_minibatches: 64  # Number of minibatches per epoch - keeps batch size ~1024 (32*1024/64)
  epochs: 4  # Number of epochs (NUM_EPOCHS in PQN)
  
  # Duration (High-throughput: ensures enough optimization steps)
  total_steps: 100_000_000  # 100M steps ensures ~1,500-2,000 updates with 1024 envs
  
  # Parallel environments for vectorization (High-throughput: massive parallelism)
  num_envs: 1024  # High-throughput regime for stable PQN online targets
  
  # Phased training: freeze parts of the network for certain steps
  # Phase 1 (0 to phase_1_steps): Only Sub-Policy trains
  # Phase 2 (phase_1_steps to phase_2_steps): Sub-Policy + Selector train
  # Phase 3 (after phase_2_steps): All components train
  phase_1_steps: 0  # Steps until selector starts training (scaled for high-throughput)
  phase_2_steps: 0  # Steps until meta-policy starts training (scaled for high-throughput)
  
  # Forced concept training mode: permanently force one concept and only train that
  # When enabled, the agent will always select the specified concept regardless of phase
  # Only the sub-policy for that concept will be trained (meta and selector are frozen)
  # Set force_concept_id to: 0=COLLECT, 1=AVOID, 2=DESTROY, 3=DEFAULT
  force_concept_mode: false  # Set to true to enable forced concept training
  force_concept_id: null  # Concept ID to force (0=COLLECT, 1=AVOID, 2=DESTROY, 3=DEFAULT)

reward:
  # 1. The Global Master (Keep High)
  # Seaquest gives 20-100 points. Keep this at 1.0 to generate signals of 20.0 - 100.0
  global_score_scale: 1.0

  # 2. Local Success (The Bridge)
  # Collecting a diver should feel good (5.0), but SCORING (Global) should feel better (20.0+)
  # This encourages the agent to "Finish the Job" (Surface) rather than just hoard divers.
  bonus_success: 5.0     # Reduced from 10.0 - bridge between shaping and global

  # 3. Shaping (The Breadcrumbs)
  # Signals must be comparable. 
  # Shaping (0.5) vs Success (5.0) vs Death (-5.0) is a healthy ratio.
  # Increased from 0.001 to 1.0 so the agent actually feels the "Pull"
  reward_scale: 1.0
  aim_bonus_scale: 1.0

  # 4. Failure (The Slap)
  # Death is bad, but it shouldn't be -50 (which scares the agent into a corner).
  # -5.0 is enough to outweigh the Local Success of one diver.
  penalty_failure: -5.0

environment:
  game_name: "seaquest"
  game_mods: ["disable_surfacing_death"]
  frame_stack_size: 4
  frame_skip: 4
  sticky_actions: true
  episodic_life: true
  first_fire: false
  noop_reset: 30
  clip_reward: false
  max_pooling: false
  screen_width: 160.0
  screen_height: 210.0
  max_objs: 34  # Reduced from 35 (Removed Player Missile from object list)
  n_global_feats: 10
  n_obj_feats: 4
  n_actions: 18

concepts:
  label_high_level_concept: 3  # Monitor / Surface
  n_capabilities: 4

wandb:
  project: "concept-transfer-rl"
  name: "pqn-seaquest-512envs"
  mode: "online"  # Set to "offline" for testing, "online" for production
  log_interval: 10
