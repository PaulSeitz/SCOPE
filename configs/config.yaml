# config.yaml

defaults:
  - experiment: seaquest_tandem
  - _self_

# --- Weights & Biases Settings ---
ENTITY: "paul-seitz-tu-darmstadt"                  # Set to your wandb username or team name if applicable
PROJECT: "concept_based_learning"
WANDB_MODE: "online"          # Use "disabled" to turn off wandb logging during debugging

# --- Global Run Settings ---
SEED: 44
NUM_SEEDS: 1                  # Number of concurrent seeds to run via vmap
EVAL_SEED: 43                 # Separate RNG seed used for evaluation rollouts
# If true, use the pre-refactor 10-channel egocentric observation format.
USE_LEGACY_EGO_OBS: false
# Seaquest only: if true, use the pre-refactor orientation-relative action mapper.
USE_LEGACY_SEAQUEST_ACTION_MAPPER: false
# Seaquest only: if true, block ascent near the surface (except forced surfacing target).
USE_LEGACY_SEAQUEST_ASCENT_BLOCK: true
# Seaquest only: if true, neutralize near-surface deaths with oxygen>0 and <6 divers.
USE_LEGACY_SEAQUEST_SURFACING_DEATH_GUARD: false
# Target-aligned ego only: clip Euclidean distance (pixels) before normalizing to [0, 1].
# Distances >= cap map to 1.0 (one \"far\" bucket). null = full-screen MAX_DIST norm.
EGO_DISTANCE_CLIP_MAX_PX: null

# Meta-policy architecture (tandem / meta_only / skill finetune with frozen meta):
#   per_object_mlp — global raw obs + per-slot object features (default)
#   flat_mlp       — raw obs only -> Dense(MAX_OBJECTS)
#   pointer        — affordance intent + attention over object slots (legacy)
META_ARCHITECTURE: "per_object_mlp"
# Object layout: index 0 is always reserved meta NOOP (see meta_object_layout.py).
# MAX_OBJECTS counts that slot plus game entities (configs use env-specific totals).
# META_USE_NOOP_TARGET: false
# META_NOOP_TARGET_IDX: 0
# Hidden trunk depth per meta architecture (fallback: META_NUM_LAYERS, then 3).
META_NUM_LAYERS: 3
META_PER_OBJECT_NUM_LAYERS: 3   # per_object_mlp only
META_FLAT_NUM_LAYERS: 3         # flat_mlp only
META_POINTER_NUM_LAYERS: 3      # pointer only
# ENV_SEED_BASE: 42           # Optional; default SEED. Each train env gets ENV_SEED_BASE+env_id so skills see diverse layouts. Auto-reset on episode end uses fresh RNG.
SAVE_PATH: "./outputs/models" # Where to save trained parameters
LOAD_PATH: null               # Set to path if you want to load a checkpoint
LOAD_PARAMS: False            # Toggle to True when resuming or evaluating
INIT_MODEL_PATH: null         # Optional path to pre-trained skill params for transfer/meta-only runs

# Eval/test env mods: null = same as training (default; curriculum videos match trained env).
# Set to a list of mod names to override eval only; use [] only to force unmodified env for eval.
EVAL_GAME_MODS: null

# --- Video recording during/every training ---
RECORD_VIDEO: True           # If true, record rollout videos (e.g. to wandb)
VIDEO_EVERY_N_UPDATES: 5000   # Record a video every N updates (used if training is run in chunks)
VIDEO_AT_END: True            # Always record one video at the end of training when RECORD_VIDEO is true
VIDEO_MAX_FRAMES: 600        # Cap episode length for recording (avoid huge files)
