# experiment/freeway_fewshot_relabel.yaml
#
# Stage 2b: continue Freeway finetune from the stage-2 checkpoint.
# Same reward contract as freeway_fewshot (overlap-only, no shaping).

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "freeway"
TRAIN_MODE: "skills_only"
META_ARCHITECTURE: "flat_mlp"

USE_LEGACY_EGO_OBS: false

GAME_MODS: null
EVAL_GAME_MODS: null

SAVE_PATH: "./outputs/models/freeway_fewshot_relabel"

alg:
  INIT_MODEL_PATH: "./outputs/models/freeway_fewshot/hierarchical_pqn_freeway_seed42.safetensors"

  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 12
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  RESTRICT_FIRE_FOR_NON_DESTROY: false

  FIRST_FIRE: false
  STICKY_ACTIONS: false
  EPISODIC_LIFE: false
  FRAME_STACK_SIZE: 4

  TOTAL_TIMESTEPS: 20_000_000
  NUM_ENVS: 512
  NUM_STEPS: 64

  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.00005
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_QLAMBDA_WATKINS_CUT: false
  SKILL_LAMBDA: 0.65

  SYMBOLIC_COLLECT_FORCE_UP: false
  COLLECT_SKILL_INDEX: 1
  SYMBOLIC_COLLECT_UP_ACTION: 1

  EPS_START: 0.15
  EPS_FINISH: 0.05
  EPS_DECAY: 0.5

  HEURISTIC_MODE: "env_specific"
  FREEWAY_THREAT_X_WEIGHT: 1.5
  FREEWAY_THREAT_Y_WEIGHT: 1.0
  FREEWAY_THREAT_WEIGHTED_DIST_THRESH: 20.0

  AVOID_HIT_PENALTY: -1.0
  AVOID_SURVIVAL_BONUS: 0.0
  AVOID_SUCCESS_REWARD: 0.0
  AVOID_PROXIMITY_GATED: true
  AVOID_NEAR_TOLERANCE: 8.0

  COLLECT_DISTANCE_SHAPING_ENABLED: false
