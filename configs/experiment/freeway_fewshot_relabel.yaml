# experiment/freeway_fewshot_relabel.yaml
#
# Stage 2b: continue Freeway finetune from the stage-2 checkpoint.
# Same reward contract as freeway_fewshot (overlap-only, no shaping).

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "freeway"
TRAIN_MODE: "skills_only"
META_ARCHITECTURE: "flat_mlp"

USE_LEGACY_EGO_OBS: false
# Match cluster Seaquest checkpoint (3 channels/frame × 4 stack = 12-dim ego input).
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 15

GAME_MODS: null
EVAL_GAME_MODS: null

SAVE_PATH: "./outputs/models/freeway_fewshot_relabel"

alg:
  INIT_MODEL_PATH: "./outputs/models/cluster/hierarchical_pqn_seaquest_seed44.safetensors"

  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 12
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  RESTRICT_FIRE_FOR_NON_DESTROY: false

  FIRST_FIRE: false
  STICKY_ACTIONS: false
  EPISODIC_LIFE: false
  FRAME_STACK_SIZE: 4

  TOTAL_TIMESTEPS: 15_000_000
  NUM_ENVS: 512
  NUM_STEPS: 64

  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_LAMBDA: 0.65

  SYMBOLIC_COLLECT_FORCE_UP: false
  COLLECT_SKILL_INDEX: 1
  SYMBOLIC_COLLECT_UP_ACTION: 1

  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35

  HEURISTIC_MODE: "env_specific"

  AVOID_SURVIVAL_BONUS: 0.0

