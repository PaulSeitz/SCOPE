# experiment/skillbootcamp_skills.yaml
#
# Kinematic Bootcamp (jax_skillbootcamp): three skills on a Seaquest-shaped PyTree.
#
# Curriculum: `main.py` splits TOTAL_TIMESTEPS evenly across CURRICULUM_PHASES and sets
# GAME_MODS per phase. Use JAXAtari registry names exactly: destroy, collect, avoid
# (lowercase; not Seaquest-style names like destroy_curriculum).
# Registry: jaxatari.games.mods.skillbootcamp_mods.SkillbootcampEnvMod.REGISTRY
#
# Phases 1–3 train one ACTIVE_MOD at a time; phase `full` trains on the combined layout
# (no mods → ACTIVE_MOD 0, all tasks on). Timesteps split evenly across phases.
#
# End-of-phase videos: `main.run_skill_curriculum` records one rollout per phase when
# RECORD_VIDEO and VIDEO_AT_END are true — to Weights & Biases if WANDB_MODE is not
# disabled, otherwise as MP4 under SAVE_PATH/curriculum_videos/... (see video_recorder).

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "skillbootcamp"
TRAIN_MODE: "skills_only"

GAME_MODS: null
# null (default): eval/video use the same mods as training each phase (see configs/config.yaml).
EVAL_GAME_MODS: null

alg:
  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 9              # slot 0 = meta NOOP; up to 8 game objects
  # System 1 ego actions: same 18-index layout as SeaQuest (NOOP, FIRE, 8 directions, 8 dir+FIRE).
  # bootcamp_action_mapper maps all indices; use 6 here for the subset (indices 0–5 only) if desired.
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 64
  NUM_LAYERS: 3

  RESTRICT_FIRE_FOR_NON_DESTROY: false

  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true

  # Bootcamp episodes are short; less total time than full Atari runs is usually enough.
  TOTAL_TIMESTEPS: 30_000_000
  NUM_ENVS: 1024
  NUM_STEPS: 64

  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: false

  EPS_START: 1.0
  EPS_FINISH: 0.05
  EPS_DECAY: 0.8

  # Staged single-task training, then joint training (main.run_skill_curriculum).
  CURRICULUM_ENABLED: true
  CURRICULUM_PHASES: ["destroy", "collect", "avoid"]
  CURRICULUM_MODS:
    destroy:
      - destroy
    collect:
      - collect
    avoid:
      - avoid
