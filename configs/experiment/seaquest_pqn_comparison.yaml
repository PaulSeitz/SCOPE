# experiment/seaquest_pqn_comparison.yaml
#
# Tandem run with flat PQN hyperparameters (LR, ε schedule, γ, λ, grad clip).
# Rollout sizing is scaled for JAX throughput — not the JAXAtari 8-env baseline.
#
# Run: python main.py experiment=seaquest_pqn_comparison
#
# Sizing identity: NUM_UPDATES = TOTAL_TIMESTEPS / (NUM_STEPS * NUM_ENVS).
# Keep rollout batch (NUM_STEPS * NUM_ENVS) and NUM_MINIBATCHES in sync so each
# minibatch stays ~256 transitions.
#
# Current: 256 envs × 64 steps = 16_384 rollout batch, 64 minibatches, 80M steps
#   → ~4_882 updates (~½ of the old 10M/8/128 reference). NUM_ENVS capped at 256
#   (pixel runs can break above that). NUM_STEPS=64 keeps 80M env-step budget; for
#   128-step rollouts at 256 envs use TOTAL_TIMESTEPS: 160_000_000 (~same update count).
#
# Caveat: flat PQN anneals ε over the first 10% of updates. Skills may need longer
# exploration to converge before meta can learn; see SKILL_EPS_* overrides below.

SAVE_PATH: "./outputs/models/seaquest_pqn_comparison"

# --- Environment & Algorithm Names ---
ALG_NAME: "hierarchical_pqn"
ENV_NAME: "seaquest"
TRAIN_MODE: "tandem"
META_ARCHITECTURE: "per_object_mlp"
USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: true
EGO_DISTANCE_CLIP_MAX_PX: 60
USE_LEGACY_SEAQUEST_ACTION_MAPPER: false
USE_LEGACY_SEAQUEST_ASCENT_BLOCK: false
USE_LEGACY_SEAQUEST_SURFACING_DEATH_GUARD: false

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  # --- Custom Architecture Dimensions ---
  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3
  RESTRICT_FIRE_FOR_NON_DESTROY: false

  # --- Meta head — flat PQN hyperparameters ---
  META_HIDDEN_SIZE: 128
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_LR: 0.00025              # matches baseline LR
  META_SWITCH_PENALTY: 0
  META_DEATH_PENALTY: -5.0
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: 0
  META_REWARD_LAMBDA: 1.0

  SKILL_LR: 0.00025

  # --- Environment Wrappers ---
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: True
  FRAME_STACK_SIZE: 4

  # --- PQN rollout / update (throughput-tuned) ---
  # ~4_882 updates @ 80M; 256 minibatch size via 16_384 / 64.
  TOTAL_TIMESTEPS: 80_000_000
  NUM_ENVS: 256
  NUM_STEPS: 64
  NUM_EPOCHS: 4
  NUM_MINIBATCHES: 64
  META_NUM_EPOCHS: 4
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  LR: 0.00025
  MAX_GRAD_NORM: 10

  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: false
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_QLAMBDA_WATKINS_CUT: false

  # --- Exploration (Epsilon-Greedy) ---
  # Baseline PQN (pqn_agent.py): ε 1 → 0.01 over EPS_DECAY * NUM_UPDATES_DECAY updates.
  EPS_START: 1.0
  EPS_FINISH: 0.01
  EPS_DECAY: 0.1

  # Meta: same schedule as flat PQN (not the default tandem META_EPS_START=0.1).
  META_EPS_START: 1.0
  META_EPS_FINISH: 0.01
  META_EPS_DECAY: 0.1

  # Skills: match baseline for full comparability. If skills lag, try e.g.:
  # SKILL_EPS_START: 0.3
  # SKILL_EPS_FINISH: 0.05
  # SKILL_EPS_DECAY: 0.35

  SKILL_FREEZE_AFTER_UPDATES: 0
  HEURISTIC_MODE: "env_specific"
  SKILL_WARMUP_UPDATES: 0
  META_LEARN_DURING_WARMUP: false
