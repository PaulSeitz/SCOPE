ALG_NAME: "hierarchical_pqn"
ENV_NAME: "seaquest" 
TRAIN_MODE: "tandem"

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  # Shared architecture
  NUM_SKILLS: 4
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID", "NAVIGATE"]
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  # Meta head
  META_HIDDEN_SIZE: 256
  META_LR: 0.00005
  META_SWITCH_PENALTY: -0.01
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: 0
  META_DEATH_PENALTY: -5.0

  # Skill optimizer
  SKILL_LR: 0.00025

  # Environment wrappers
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FRAME_STACK_SIZE: 4

  # Rollout/update settings
  TOTAL_TIMESTEPS: 20_000_000
  NUM_ENVS: 256
  NUM_STEPS: 64
  NUM_EPOCHS: 2
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.00001
  MAX_GRAD_NORM: 0.8

  # Exploration
  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35
  META_EPS_START: 1.0
  META_EPS_FINISH: 0.05
  META_EPS_DECAY: 0.5

  # Skill updates
  OFF_POLICY: true

  # Warmup: use nearest-object heuristic for the first N updates so skills
  # see clean, consistent target assignments before the meta policy explores.
  HEURISTIC_MODE: "nearest"
  SKILL_WARMUP_UPDATES: 200
  META_LEARN_DURING_WARMUP: false
