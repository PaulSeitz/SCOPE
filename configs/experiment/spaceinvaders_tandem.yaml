# experiment/spaceinvaders_tandem.yaml

# --- Environment & Algorithm Names ---
ALG_NAME: "hierarchical_pqn"
ENV_NAME: "spaceinvaders"
TRAIN_MODE: "tandem"
META_ARCHITECTURE: "per_object_mlp"

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 41
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  RESTRICT_FIRE_FOR_NON_DESTROY: false

  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_LR: 0.00001
  META_SWITCH_PENALTY: -0.01
  META_DEATH_PENALTY: -5.0
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: 0

  SKILL_LR: 0.0001

  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4

  INVALID_EGO_ACTIONS: []

  TOTAL_TIMESTEPS: 10_000_000
  NUM_ENVS: 1024
  NUM_STEPS: 128

  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: true

  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35
  META_EPS_START: 0.2

  HEURISTIC_MODE: "env_specific"
  SKILL_WARMUP_UPDATES: 0
  META_LEARN_DURING_WARMUP: false
