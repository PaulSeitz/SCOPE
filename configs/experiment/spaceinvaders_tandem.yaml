# experiment/spaceinvaders_tandem.yaml
#
# Space Invaders tandem run (scratch meta + skills).
# - Sticky meta (mission_avoid): lock COLLECT/DESTROY until done; AVOID may interrupt
# - No heuristic warmup, no switch penalty
# - Reward separation: meta ← env only, skills ← sparse concept rewards only

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "spaceinvaders"
TRAIN_MODE: "tandem"
META_ARCHITECTURE: "per_object_mlp"

SAVE_PATH: "./outputs/models/spaceinvaders_tandem"

USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
USE_EGO_WEAPON_FEATURES: true
EGO_DISTANCE_CLIP_MAX_PX: 20

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  META_TARGET_PERSIST_MODE: mission_avoid
  META_AVOID_INTERRUPT_MARGIN: 0.0
  META_AVOID_RESUME_MISSION: true
  META_TARGET_LOCKED_INPUT: true

  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 41
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 4
  META_FLAT_NUM_LAYERS: 4
  META_LR: 0.0005
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: 0
  META_SWITCH_PENALTY: 0.0
  META_DEATH_PENALTY: -10.0

  META_REWARD_LAMBDA: 1.0
  SKILL_REWARD_LAMBDA: 0.0

  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4

  TOTAL_TIMESTEPS: 50_000_000
  NUM_ENVS: 1024
  NUM_STEPS: 32
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  LR: 0.0001
  SKILL_LR: 0.0005
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_TARGET_CUT: "global"

  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35
  META_EPS_START: 0.1
  META_EPS_FINISH: 0.05
  META_EPS_DECAY: 0.95
  META_NUM_EPOCHS: 3

  SKILL_FREEZE_AFTER_UPDATES: 0
  SKILL_WARMUP_UPDATES: 0
  META_LEARN_DURING_WARMUP: false
