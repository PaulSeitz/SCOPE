# experiment/seaquest_tandem_ceiling_cut_global.yaml
#
# Ablation: SKILL_TARGET_CUT=global — cut every relabel slot at each meta switch.
# Otherwise identical to seaquest_tandem_ceiling.yaml.

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "seaquest"
TRAIN_MODE: "tandem"
META_ARCHITECTURE: "per_object_mlp"

SAVE_PATH: "./outputs/models/seaquest_tandem_ceiling_cut_global"

USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: true
USE_SKILL_EGO_FEATURES: true
SKILL_EGO_EXTRA_DIM: 4
EGO_DISTANCE_CLIP_MAX_PX: 40
USE_LEGACY_SEAQUEST_ACTION_MAPPER: false
USE_LEGACY_SEAQUEST_ASCENT_BLOCK: false
USE_LEGACY_SEAQUEST_SURFACING_DEATH_GUARD: false

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 256
  NUM_LAYERS: 3

  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 4
  META_FLAT_NUM_LAYERS: 4
  META_LR: 0.0005
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: 0
  META_SWITCH_PENALTY: 0.0
  META_DEATH_PENALTY: -10.0

  META_REWARD_LAMBDA: 1.0
  SKILL_REWARD_LAMBDA: 0.0

  FORCE_SURFACE_OVERRIDE: false
  SURFACE_PICK_PROB: 0.0
  ALWAYS_ACTIVE_SURFACE_TARGET: false

  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4

  TOTAL_TIMESTEPS: 100_000_000
  NUM_ENVS: 1024
  NUM_STEPS: 64
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  LR: 0.0001
  SKILL_LR: 0.0005
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_QLAMBDA_WATKINS_CUT: false

  SKILL_TARGET_CUT: "global"

  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35
  META_EPS_START: 0.1
  META_EPS_FINISH: 0.05
  META_EPS_DECAY: 0.95
  META_NUM_EPOCHS: 3

  SKILL_FREEZE_AFTER_UPDATES: 0
  SKILL_WARMUP_UPDATES: 0
  META_LEARN_DURING_WARMUP: false
