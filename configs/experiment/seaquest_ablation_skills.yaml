ALG_NAME: "hierarchical_pqn_step1_skills"
ENV_NAME: "seaquest"
TRAIN_MODE: "skills_only"
USE_LEGACY_EGO_OBS: false

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  # Shared architecture — must match step 3 and step 4 exactly
  NUM_SKILLS: 4
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID", "NAVIGATE"]
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  # Environment wrappers
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FRAME_STACK_SIZE: 4

  # Rollout/update settings
  TOTAL_TIMESTEPS: 20_000_000
  NUM_ENVS: 256
  NUM_STEPS: 64
  NUM_EPOCHS: 2
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  LAMBDA: 0.65
  MAX_GRAD_NORM: 0.8

  # Skill optimizer
  SKILL_LR: 0.00025
  LR: 0.00025   # fallback, same as SKILL_LR

  # Exploration — skills only, single schedule
  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35   # optax transition_steps (near-instant decay; legacy semantics)

  # Off-policy: all skills learn from every transition regardless of which was active
  OFF_POLICY: true

  # Target selection: nearest active object — env-agnostic, no seaquest-specific logic
  # Switch to "env_specific" in step 2 to test whether heuristic quality matters
  HEURISTIC_MODE: "env_specific"

  # Meta policy is not used in skills_only mode; these keys are ignored but kept
  # here so diffs against step 3 and step 4 configs are easy to read
  META_HIDDEN_SIZE: 256
  META_LR: 0.00005
  META_EPS_START: 1.0
  META_EPS_FINISH: 0.05
  META_EPS_DECAY: 0.5
  META_SWITCH_PENALTY: -0.005
  META_DEATH_PENALTY: 0.0

  # Save the trained skill params so step 3 can load them
  SAVE_PATH: "./outputs/models"
