# experiment/seaquest_meta_only.yaml
#
# Stage 2: train a learned meta policy on frozen Seaquest skills (no heuristic).
# Run experiment=seaquest_skills_pretrain first, then point INIT_MODEL_PATH at its output.

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "seaquest"
TRAIN_MODE: "meta_only"
META_ARCHITECTURE: "flat_mlp"

# Must match seaquest_skills_pretrain / the skill checkpoint (seed 44 by default).
USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 20
USE_LEGACY_SEAQUEST_ACTION_MAPPER: false
USE_LEGACY_SEAQUEST_ASCENT_BLOCK: false
USE_LEGACY_SEAQUEST_SURFACING_DEATH_GUARD: false

GAME_MODS: null
EVAL_GAME_MODS: null

SAVE_PATH: "./outputs/models/seaquest_meta_only"

alg:
  # Skills from seaquest_skills_pretrain (same ego layout as that run).
  # Filename: {SAVE_PATH}/{ENV_NAME}/{ALG_NAME}_{ENV_NAME}_seed{SEED}.safetensors
  INIT_MODEL_PATH: "./outputs/models/seaquest_skills_pretrain/seaquest/hierarchical_pqn_seaquest_seed44.safetensors"

  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  # Meta head — aligned with experiment/seaquest_tandem.yaml
  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_LR: 0.0005
  META_SWITCH_PENALTY: 0.0
  META_DEATH_PENALTY: 0.0
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: 0
  META_REWARD_LAMBDA: 1.0

  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4

  # PQN rollout / update — same scale as seaquest_tandem
  TOTAL_TIMESTEPS: 50_000_000
  NUM_ENVS: 2048
  NUM_STEPS: 64
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.0005
  MAX_GRAD_NORM: 0.8

  # Meta target exploration (train_meta_agent uses EPS_* for the meta head).
  # Mirrors tandem META_EPS_START with skill EPS_FINISH / EPS_DECAY.
  EPS_START: 0.1
  EPS_FINISH: 0.05
  EPS_DECAY: 0.95
