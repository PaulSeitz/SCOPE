# experiment/seaquest_pqn_paper.yaml
#
# Tandem run with Atari PQN paper hyperparameters (Hadamax / PureJaxQL table):
#   NUM_ENVS 128, NUM_STEPS 32, NUM_EPOCHS 2, NUM_MINIBATCHES 32
#   EPS 1.0 → 0.001 over EPS_DECAY 0.1, LR 2.5e-4, MAX_GRAD_NORM 10
#   GAMMA 0.99, LAMBDA 0.65, NORM_TYPE layer_norm, NORM_INPUT False,
#   LR_LINEAR_DECAY False (constant LR; hierarchical trainer already uses fixed LR)
#
# CLIP_REWARD: false — original PQN / JAXAtari pqn_agent uses sign-clipped rewards
# for training; this config keeps raw env returns for the meta TD target.
#
# Architecture for this project: pixel meta embed + ego skill observations.
#
# Run: python main.py experiment=seaquest_pqn_paper
#
# Sizing: 128 envs × 32 steps = 4096 rollout; 32 minibatches → batch size 128
# (matches the paper). NUM_UPDATES = TOTAL_TIMESTEPS / 4096.

SAVE_PATH: "./outputs/models/seaquest_pqn_paper"
WANDB_RUN_NAME: sq_pqn_paper_mi_pixel_si_ego
WANDB_TAGS:
- suite:pqn_paper
- env:seaquest
- train_mode:tandem
- meta_input:pixel_embed
- skill_input:ego

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "seaquest"
TRAIN_MODE: "tandem"
META_ARCHITECTURE: "per_object_mlp"

USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: true
EGO_DISTANCE_CLIP_MAX_PX: 20
USE_LEGACY_SEAQUEST_ACTION_MAPPER: false
USE_LEGACY_SEAQUEST_ASCENT_BLOCK: false
USE_LEGACY_SEAQUEST_SURFACING_DEATH_GUARD: false

GAME_MODS: null
EVAL_GAME_MODS: null

# Meta: pixel embed (84×84 grayscale, native downscale — same as input ablation).
META_INPUT_MODE: pixel_embed
META_NORM_TYPE: "layer_norm"
META_PIXEL_DO_RESIZE: true
META_PIXEL_USE_NATIVE_DOWNSCALING: true
META_PIXEL_RESIZE_SHAPE: [84, 84]
META_PIXEL_GRAYSCALE: true
META_EMBED_DIM: 256

# Skills: egocentric observations.
SKILL_INPUT_MODE: ego
SKILL_EMBED_DIM: 256

# Paper parity keys (flat PQN); hierarchical path uses META_NORM_TYPE + constant LR.
NORM_TYPE: "layer_norm"
NORM_INPUT: false
LR_LINEAR_DECAY: false

alg:
  NUM_SKILLS: 4
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID", "NAVIGATE"]
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3
  RESTRICT_FIRE_FOR_NON_DESTROY: false

  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_EMBED_DIM: 256
  SKILL_EMBED_DIM: 256
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: null
  META_SWITCH_PENALTY: -0.05
  META_DEATH_PENALTY: 0.0
  META_REWARD_LAMBDA: 1.0
  SKILL_REWARD_LAMBDA: 0.0
  META_Q_STICKINESS_ENABLED: false

  # Paper LR for both heads.
  LR: 0.00025
  META_LR: 0.00025
  SKILL_LR: 0.00025

  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4

  # --- PQN paper rollout / update ---
  TOTAL_TIMESTEPS: 100_000_000
  NUM_ENVS: 128
  NUM_STEPS: 32
  NUM_EPOCHS: 2
  NUM_MINIBATCHES: 32
  META_NUM_EPOCHS: 2
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  MAX_GRAD_NORM: 10

  # Original PQN / JAXAtari pqn_agent trains with sign-clipped rewards (CLIP_REWARD:
  # true). This run uses raw env returns for meta TD targets.
  CLIP_REWARD: false

  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: 15
  SKILL_BOOTSTRAP_CHUNK_STEPS: 16
  SKILL_BOOTSTRAP: "q_lambda"

  # Paper ε schedule (meta + skills).
  EPS_START: 1.0
  EPS_FINISH: 0.001
  EPS_DECAY: 0.1
  META_EPS_START: 1.0
  META_EPS_FINISH: 0.001
  META_EPS_DECAY: 0.1

  SKILL_FREEZE_AFTER_UPDATES: 0
  SKILL_WARMUP_UPDATES: 0
  META_LEARN_DURING_WARMUP: false
  HEURISTIC_MODE: "env_specific"

  META_INPUT_MODE: pixel_embed
  SKILL_INPUT_MODE: ego
  META_PIXEL_CNN_CHANNELS: [32, 64]
  SKILL_PIXEL_CNN_CHANNELS: [32, 64]
