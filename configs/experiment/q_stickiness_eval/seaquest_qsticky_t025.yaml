  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.5
  META_EPS_START: 0.1
  META_NUM_EPOCHS: 2
  SKILL_WARMUP_UPDATES: 200
  META_LEARN_DURING_WARMUP: false
  HEURISTIC_MODE: env_specific
  SKILL_EPS_START: 0.0
  SKILL_EPS_FINISH: 0.0
  SKILL_EPS_DECAY: 0.5
  INIT_MODEL_PATH: ./outputs/models/q_stickiness_eval/phase1_skills/seaquest/hierarchical_pqn_seaquest_seed44_skills.safetensors
