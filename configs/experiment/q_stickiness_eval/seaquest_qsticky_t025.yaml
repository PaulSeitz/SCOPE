  SKILL_NAMES:
  - DESTROY
  - COLLECT
  - AVOID
  - NAVIGATE
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3
  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_EMBED_DIM: 256
  SKILL_EMBED_DIM: 256
  META_LR: 0.0005
  SKILL_LR: 1.0e-05
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: null
  META_SWITCH_PENALTY: 0.0
  META_DEATH_PENALTY: 0.0
  META_REWARD_LAMBDA: 1.0
  SKILL_REWARD_LAMBDA: 0.0
  META_Q_STICKINESS_ENABLED: true
  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4
  TOTAL_TIMESTEPS: 30000000
  NUM_ENVS: 512
  NUM_STEPS: 64
  NUM_EPOCHS: 2
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  LR: 1.0e-05
  MAX_GRAD_NORM: 0.8
  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
