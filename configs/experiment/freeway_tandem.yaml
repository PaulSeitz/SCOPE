# experiment/freeway_tandem.yaml

# --- Environment & Algorithm Names ---
ALG_NAME: "hierarchical_pqn"
ENV_NAME: "freeway"
TRAIN_MODE: "tandem"
META_ARCHITECTURE: "flat_mlp"

# --- Environment modification hooks ---
GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  # --- Custom Architecture Dimensions ---
  NUM_SKILLS: 3               # DESTROY (unused), COLLECT, AVOID
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  # slot 0 = meta NOOP; slots 1-10 = 10 cars (AVOID); slot 11 = fixed top goal (COLLECT)
  MAX_OBJECTS: 12
  EGO_ACTION_DIM: 18          # standard 18-dim egocentric space
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  # Freeway has no FIRE; restrict fire actions for non-destroy skills to keep the
  # action space clean (FIRE maps to NOOP, so this is just informational).
  RESTRICT_FIRE_FOR_NON_DESTROY: false

  # --- Meta head (tandem only) ---
  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_LR: 0.0001
  META_SWITCH_PENALTY: 0
  META_DEATH_PENALTY: -1.0
  META_USE_NOOP_TARGET: false
  META_NOOP_TARGET_IDX: 0

  # Use full environment reward for meta training
  META_REWARD_LAMBDA: 0.5

  # Skill optimizer
  SKILL_LR: 0.0001

  # --- Environment Wrappers ---
  FIRST_FIRE: false            # Freeway has no FIRE start
  STICKY_ACTIONS: false
  EPISODIC_LIFE: false         # Freeway is time-limited, not lives-based
  FRAME_STACK_SIZE: 4

  # --- PQN Rollout Hyperparameters ---
  TOTAL_TIMESTEPS: 50_000_000
  NUM_ENVS: 1024
  NUM_STEPS: 64

  # --- PQN Update Hyperparameters ---
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.9
  LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8

  # --- Policy Style for Skill Updates ---
  # Off-policy: let all skills learn from every transition so the (rare) collect
  # skill still gets updates even when the meta mostly picks AVOID targets.
  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_QLAMBDA_WATKINS_CUT: false
  SKILL_LAMBDA: 0.9

  # Freeway heuristic: default collect, override on imminent lane threat.
  FREEWAY_THREAT_X_WEIGHT: 2.0
  FREEWAY_THREAT_Y_WEIGHT: 1.0
  FREEWAY_THREAT_WEIGHTED_DIST_THRESH: 12.0

  # AVOID reward knobs (object-relative relabeling).
  AVOID_HIT_PENALTY: -1.0
  AVOID_SURVIVAL_BONUS: 0.0
  AVOID_SUCCESS_REWARD: 0.0
  AVOID_PROXIMITY_GATED: true
  AVOID_NEAR_TOLERANCE: 6.0

  COLLECT_GOAL_DENSE_SHAPING_ENABLED: true
  COLLECT_GOAL_DENSE_WEIGHT: 1.0
  COLLECT_GOAL_UPWARD_BONUS_PER_PIXEL: 0.02
  COLLECT_GOAL_ONLY_RELABEL: true
  COLLECT_GOAL_OBJECT_IDX: 11

  # --- Exploration (Epsilon-Greedy) ---
  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35
  META_EPS_START: 0.2

  # --- Epochs (tandem only) ---
  META_NUM_EPOCHS: 3

  # --- Skill freezing (tandem only) ---
  SKILL_FREEZE_AFTER_UPDATES: 0

  # --- Warmup (tandem only) ---
  HEURISTIC_MODE: "env_specific"
  SKILL_WARMUP_UPDATES: 200
  META_LEARN_DURING_WARMUP: true
