# Curated multi-env input ablation (9 full tandem runs, 25M steps each).
#
# RTPT (nvidia-smi): HRL_input_ablation, or HRL_input_ablation1 / HRL_input_ablation2 with --manifest-shard
#
# Single GPU (all 9 runs, sequential):
#   python scripts/run_ablation_eval.py --suite input_ablation --manifest manifest_multi_env.yaml
#
# Two GPUs (5 + 4 runs in parallel):
#   CUDA_VISIBLE_DEVICES=0 python scripts/run_ablation_eval.py --suite input_ablation --manifest manifest_multi_env.yaml --manifest-shard 1/2 &
#   CUDA_VISIBLE_DEVICES=1 python scripts/run_ablation_eval.py --suite input_ablation --manifest manifest_multi_env.yaml --manifest-shard 2/2 &
#   wait
#
# Preview a shard:
#   python scripts/run_ablation_eval.py --suite input_ablation --manifest manifest_multi_env.yaml --manifest-shard 1/2 --list-matrix
#
# Smoke: add --trial (wandb disabled, short TOTAL_TIMESTEPS).
name: multi_env_input_ablation
description: >
  Seaquest + SpaceInvaders (pixel/oc meta x pixel skills),
  Freeway (pixel meta x ego/pixel skills),
  BeamRider (pixel/oc meta x ego skills + pixel meta x pixel skills).
runs:
  # seaquest
  - env: seaquest
    variant: mi_pixel_embed_si_pixel_embed
  - env: seaquest
    variant: mi_oc_embed_si_pixel_embed
  # spaceinvaders
  - env: spaceinvaders
    variant: mi_pixel_embed_si_pixel_embed
  - env: spaceinvaders
    variant: mi_oc_embed_si_pixel_embed
  # freeway
  - env: freeway
    variant: mi_pixel_embed_si_ego
  - env: freeway
    variant: mi_pixel_embed_si_pixel_embed
  # beamrider
  - env: beamrider
    variant: mi_pixel_embed_si_ego
  - env: beamrider
    variant: mi_oc_embed_si_ego
  - env: beamrider
    variant: mi_pixel_embed_si_pixel_embed
