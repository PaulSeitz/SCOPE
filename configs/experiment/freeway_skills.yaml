# experiment/freeway_skills.yaml

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "freeway"
TRAIN_MODE: "skills_only"
META_ARCHITECTURE: "flat_mlp"

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 12
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  # Freeway has no FIRE, but we keep the full ego action space for parity.
  RESTRICT_FIRE_FOR_NON_DESTROY: false

  FIRST_FIRE: false
  STICKY_ACTIONS: false
  EPISODIC_LIFE: false
  FRAME_STACK_SIZE: 4

  TOTAL_TIMESTEPS: 50_000_000
  NUM_ENVS: 512
  NUM_STEPS: 64

  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_QLAMBDA_WATKINS_CUT: false
  SKILL_LAMBDA: 0.65
  SYMBOLIC_COLLECT_FORCE_UP: false
  COLLECT_SKILL_INDEX: 1
  SYMBOLIC_COLLECT_UP_ACTION: 1

  EPS_START: 1.0
  EPS_FINISH: 0.05
  EPS_DECAY: 0.8

  HEURISTIC_MODE: "env_specific"
  FREEWAY_THREAT_X_WEIGHT: 1.5
  FREEWAY_THREAT_Y_WEIGHT: 1.0
  FREEWAY_THREAT_WEIGHTED_DIST_THRESH: 20.0

  # Kept for aligned ablations with tandem skill reward settings.
  AVOID_HIT_PENALTY: -1.0
  AVOID_SURVIVAL_BONUS: 0.0
  AVOID_SUCCESS_REWARD: 0.0
  AVOID_PROXIMITY_GATED: True # activates or deactivates learning on objects that are far away using AVOID_NEAR_TOLERANCE
  AVOID_NEAR_TOLERANCE: 8.0

  COLLECT_DISTANCE_SHAPING_ENABLED: true
  COLLECT_Y_SHAPING_PER_PIXEL: 0.01
