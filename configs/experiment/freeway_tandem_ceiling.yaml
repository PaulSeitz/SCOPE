# experiment/freeway_tandem_ceiling.yaml
#
# Clean Freeway tandem ceiling run (400M steps).
# Skills init from seaquest_tandem_ceiling (skills checkpoint only); meta from scratch.
# Run seaquest_tandem_ceiling first.

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "freeway"
TRAIN_MODE: "tandem"
META_ARCHITECTURE: "per_object_mlp"

SAVE_PATH: "./outputs/models/freeway_tandem_ceiling"

USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 40

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  INIT_MODEL_PATH: ./outputs/models/seaquest_tandem_ceiling/seaquest/hierarchical_pqn_seaquest_seed44_skills.safetensors

  NUM_SKILLS: 4
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID", "NAVIGATE"]
  MAX_OBJECTS: 12
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 256
  NUM_LAYERS: 3

  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 4
  META_FLAT_NUM_LAYERS: 4
  META_LR: 0.0005
  META_USE_NOOP_TARGET: false
  META_NOOP_TARGET_IDX: null
  META_SWITCH_PENALTY: 0.0
  META_DEATH_PENALTY: 0.0

  META_REWARD_LAMBDA: 1.0
  SKILL_REWARD_LAMBDA: 0.0

  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: false
  STICKY_ACTIONS: false
  EPISODIC_LIFE: false
  FRAME_STACK_SIZE: 4

  TOTAL_TIMESTEPS: 400_000_000
  NUM_ENVS: 1024
  NUM_STEPS: 64
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.9
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.9
  LR: 0.0001
  SKILL_LR: 0.0001
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"

  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35
  META_EPS_START: 0.2
  META_EPS_FINISH: 0.05
  META_EPS_DECAY: 0.8
  META_NUM_EPOCHS: 3

  SKILL_FREEZE_AFTER_UPDATES: 0
  SKILL_WARMUP_UPDATES: 0
  META_LEARN_DURING_WARMUP: false

  # Freeway concept-reward knobs only (no env reward in skill training)
  AVOID_SURVIVAL_BONUS: 0.0
