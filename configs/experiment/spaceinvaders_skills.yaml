# experiment/spaceinvaders_skills.yaml

# --- Environment & Algorithm Names ---
ALG_NAME: "hierarchical_pqn"
ENV_NAME: "spaceinvaders"
TRAIN_MODE: "skills_only"

# --- Environment modification hooks ---
GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  # --- Custom Architecture Dimensions ---
  NUM_SKILLS: 3               # DESTROY, COLLECT, AVOID
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  # slot 0 = meta NOOP; 36 enemies + 3 enemy bullets + 1 UFO
  MAX_OBJECTS: 41
  EGO_ACTION_DIM: 18          # mapped to 6 horizontal Atari actions via spaceinvaders_action_mapper
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  RESTRICT_FIRE_FOR_NON_DESTROY: false

  # --- Environment Wrappers ---
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4

  # Horizontal-only env: forward ego actions collapse to NOOP/FIRE (shoot at targets above).
  INVALID_EGO_ACTIONS: []

  # --- PQN Rollout Hyperparameters ---
  TOTAL_TIMESTEPS: 50_000_000
  NUM_ENVS: 1024
  NUM_STEPS: 64

  # --- PQN Update Hyperparameters ---
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: true

  EPS_START: 1.0
  EPS_FINISH: 0.05
  EPS_DECAY: 0.8
