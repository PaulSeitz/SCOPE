# experiment/spaceinvaders_skills.yaml
#
# Clean Space Invaders skills-only run (heuristic target selection via spaceinvaders_policy).
# - No action masking or curriculum staging
# - Full off-policy with RELABEL_ALL_OBJECTS

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "spaceinvaders"
TRAIN_MODE: "skills_only"

SAVE_PATH: "./outputs/models/spaceinvaders_skills"

USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
USE_SKILL_EGO_FEATURES: true
SKILL_EGO_EXTRA_DIM: 4
EGO_DISTANCE_CLIP_MAX_PX: 20

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 41
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  RESTRICT_FIRE_FOR_NON_DESTROY: false

  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4

  TOTAL_TIMESTEPS: 50_000_000
  NUM_ENVS: 1024
  NUM_STEPS: 32

  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_QLAMBDA_WATKINS_CUT: false

  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35
