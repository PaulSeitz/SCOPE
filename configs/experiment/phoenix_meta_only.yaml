ALG_NAME: "hierarchical_pqn"
ENV_NAME: "phoenix"
TRAIN_MODE: "meta_only"

# Training/eval env modifications (meta training is still forced to base env in main.py).
GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  # Required for meta_only: path to pre-trained skill parameters.
  # Must match the filename written by main.py: {ALG_NAME}_{ENV_NAME}_seed{SEED}.safetensors
  INIT_MODEL_PATH: "./outputs/models/seaquest/hierarchical_pqn_seaquest_seed42.safetensors"

  # Shared dimensions
  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 221
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  # Meta-network settings (System 2)
  META_HIDDEN_SIZE: 256
  META_LR: 0.00025
  # Additive sticky-target bonus (applied before argmax in meta target selection).
  META_HYSTERESIS_BONUS: 0.0
  # Make a dedicated NOOP target selectable (index 0 by convention).
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: 0
  META_SWITCH_PENALTY: -0.005

  # Environment wrappers
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: True
  RESTRICT_FIRE_FOR_NON_DESTROY: false
  # JAXAtari `AtariWrapper` stack depth. Skill MLP input length =
  # EGO_OBS_CHANNELS_PER_FRAME * FRAME_STACK_SIZE (10 * stack by default).
  # Must match the INIT_MODEL_PATH checkpoint (Dense_0 input size).
  FRAME_STACK_SIZE: 4

  # Training horizon / PPO-style update settings reused by meta trainer
  TOTAL_TIMESTEPS: 20_000_000
  NUM_ENVS: 1024
  NUM_STEPS: 64
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.0005
  MAX_GRAD_NORM: 0.8

  # Exploration
  # Meta-only with frozen skills is very sensitive to fully random target choice.
  # Start with lower exploration so System 2 can leverage pre-trained System 1.
  EPS_START: 0.2
  EPS_FINISH: 0.001
  EPS_DECAY: 0.3