# feature_eval/seaquest_skills_heuristic_collect_death.yaml
# Ablation: same as seaquest_skills_heuristic, but COLLECT gets SKILL_DEATH_PENALTY
# on life loss (pre-7b4348d behavior). Default recipe keeps COLLECT death off —
# this is a skeptical A/B for suicidal COLLECT bobbing in videos.
# Filter: suite:feature_eval

ALG_NAME: hierarchical_pqn
TRAIN_MODE: skills_only
USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: true
USE_EGO_BLOCKING_FEATURES: true
USE_EGO_WEAPON_FEATURES: true
EGO_DISTANCE_CLIP_MAX_PX: 30
GAME_MODS: null
EVAL_GAME_MODS: null
ENV_NAME: seaquest
USE_LEGACY_SEAQUEST_ACTION_MAPPER: false
USE_LEGACY_SEAQUEST_ASCENT_BLOCK: false
USE_LEGACY_SEAQUEST_SURFACING_DEATH_GUARD: false
SAVE_PATH: ./outputs/models/feature_eval/seaquest_skills_heuristic_collect_death
WANDB_RUN_NAME: sq_feat_skills_heuristic_collect_death
WANDB_TAGS:
- suite:feature_eval
- env:seaquest
- train_mode:skills_only
- skill_input:ego
- variant:skills_heuristic_collect_death
- ego:blocking
- ego:weapon
- ablation:collect_death
SKILL_INPUT_MODE: ego
SKILL_DEATH_PENALIZE_COLLECT: true
RECORD_VIDEO: true
VIDEO_AT_END: true
VIDEO_MAX_FRAMES: 600
VIDEO_FRAME_STRIDE: 4
alg:
  NUM_SKILLS: 4
  SKILL_NAMES:
  - DESTROY
  - COLLECT
  - AVOID
  - NAVIGATE
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3
  SKILL_EMBED_DIM: 256
  SKILL_LR: 0.001
  SKILL_REWARD_LAMBDA: 0.0
  CLIP_REWARD: true
  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4
  # No Atari action-repeat: react every env frame (velocity is in ego feats).
  FRAME_SKIP: 1
  TOTAL_TIMESTEPS: 49938432
  NUM_ENVS: 256
  NUM_STEPS: 128
  NUM_EPOCHS: 4
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8
  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: false
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: q_lambda
  EPS_START: 0.2
  EPS_FINISH: 0.01
  EPS_DECAY: 0.2
  HEURISTIC_MODE: env_specific
  SKILL_INPUT_MODE: ego
  SKILL_DEATH_PENALIZE_COLLECT: true
