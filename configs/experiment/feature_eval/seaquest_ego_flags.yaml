# feature_eval/seaquest_ego_flags.yaml
# Same as baseline_ego, plus USE_EGO_BLOCKING_FEATURES (LoS / obstacle ray flag).
# Filter: suite:feature_eval

ALG_NAME: hierarchical_pqn
TRAIN_MODE: tandem
META_ARCHITECTURE: per_object_mlp
USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: true
USE_EGO_BLOCKING_FEATURES: true
USE_EGO_WEAPON_FEATURES: true
EGO_DISTANCE_CLIP_MAX_PX: 40
GAME_MODS: null
EVAL_GAME_MODS: null
ENV_NAME: seaquest
USE_LEGACY_SEAQUEST_ACTION_MAPPER: false
USE_LEGACY_SEAQUEST_ASCENT_BLOCK: false
USE_LEGACY_SEAQUEST_SURFACING_DEATH_GUARD: false
META_PIXEL_DO_RESIZE: true
META_PIXEL_USE_NATIVE_DOWNSCALING: true
META_PIXEL_RESIZE_SHAPE:
- 84
- 84
META_PIXEL_GRAYSCALE: true
SAVE_PATH: ./outputs/models/feature_eval/seaquest_ego_flags
WANDB_RUN_NAME: sq_feat_ego_flags
WANDB_TAGS:
- suite:feature_eval
- env:seaquest
- train_mode:tandem
- meta_input:pixel_embed
- skill_input:ego
- variant:ego_flags
- ego:blocking
- ego:weapon
META_INPUT_MODE: pixel_embed
SKILL_INPUT_MODE: ego
RECORD_VIDEO: true
VIDEO_AT_END: true
alg:
  NUM_SKILLS: 4
  SKILL_NAMES:
  - DESTROY
  - COLLECT
  - AVOID
  - NAVIGATE
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3
  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_EMBED_DIM: 256
  SKILL_EMBED_DIM: 256
  META_LR: 0.0005
  SKILL_LR: 0.0005
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: null
  META_SWITCH_PENALTY: 0.0
  META_DEATH_PENALTY: 0.0
  META_REWARD_LAMBDA: 1.0
  SKILL_REWARD_LAMBDA: 0.0
  META_Q_STICKINESS_ENABLED: false
  CLIP_REWARD: true
  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4
  TOTAL_TIMESTEPS: 49938432
  NUM_ENVS: 256
  NUM_STEPS: 128
  NUM_EPOCHS: 4
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8
  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: q_lambda
  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35
  META_EPS_START: 0.4
  META_EPS_FINISH: 0.05
  META_EPS_DECAY: 0.7
  META_NUM_EPOCHS: 3
  SKILL_WARMUP_UPDATES: 0
  META_LEARN_DURING_WARMUP: false
  HEURISTIC_MODE: env_specific
  META_PIXEL_CNN_CHANNELS: &id001
  - 16
  - 32
  SKILL_PIXEL_CNN_CHANNELS: *id001
  META_INPUT_MODE: pixel_embed
  SKILL_INPUT_MODE: ego
