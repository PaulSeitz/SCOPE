# feature_eval/kangaroo_ladder_only_probe.yaml
# Ladder-isolation setup: strip monkeys/coconuts/fruit/bell, lock level 1.
# Use with scripts/kangaroo_ladder_climb_probe.py or:
#   python -m concept_based_learning.pqn_visualizer \
#     --experiment feature_eval/kangaroo_ladder_only_probe \
#     --game-mods no_danger no_thrown_coconut no_fruit no_bell first_level_only
# Filter: suite:feature_eval

ALG_NAME: hierarchical_pqn
TRAIN_MODE: skills_only
USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: true
USE_EGO_BLOCKING_FEATURES: true
USE_EGO_WEAPON_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 40
# Ladder-only mods (JAXAtari kangaroo registry).
GAME_MODS:
- no_danger
- no_thrown_coconut
- no_fruit
- no_bell
- first_level_only
EVAL_GAME_MODS:
- no_danger
- no_thrown_coconut
- no_fruit
- no_bell
- first_level_only
ENV_NAME: kangaroo
SAVE_PATH: ./outputs/models/feature_eval/kangaroo_ladder_only_probe
WANDB_RUN_NAME: kg_ladder_only_probe
WANDB_TAGS:
- suite:feature_eval
- env:kangaroo
- train_mode:skills_only
- variant:ladder_only_probe
SKILL_INPUT_MODE: ego
RECORD_VIDEO: false
alg:
  NUM_SKILLS: 3
  SKILL_NAMES:
  - DESTROY
  - COLLECT
  - AVOID
  MAX_OBJECTS: 55
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3
  SKILL_EMBED_DIM: 256
  SKILL_LR: 0.0005
  SKILL_REWARD_LAMBDA: 0.0
  CLIP_REWARD: true
  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: false
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4
  TOTAL_TIMESTEPS: 1000000
  NUM_ENVS: 32
  NUM_STEPS: 128
  NUM_EPOCHS: 4
  NUM_MINIBATCHES: 8
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8
  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: q_lambda
  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35
  HEURISTIC_MODE: env_specific
  SKILL_INPUT_MODE: ego
