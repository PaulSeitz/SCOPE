# persistence_eval/seaquest_tandem_mission_avoid.yaml
# Tandem on Seaquest: lock COLLECT/DESTROY until done; AVOID may interrupt via meta Q.

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "seaquest"
TRAIN_MODE: "tandem"
META_ARCHITECTURE: "per_object_mlp"

SAVE_PATH: "./outputs/models/persistence_eval/mission_avoid"

USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 20
USE_LEGACY_SEAQUEST_ACTION_MAPPER: false
USE_LEGACY_SEAQUEST_ASCENT_BLOCK: false
USE_LEGACY_SEAQUEST_SURFACING_DEATH_GUARD: false

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  INIT_MODEL_PATH: ./outputs/models/persistence_eval/phase1_skills/seaquest/hierarchical_pqn_seaquest_seed44.safetensors

  META_TARGET_PERSIST_MODE: mission_avoid
  META_AVOID_INTERRUPT_MARGIN: 0.0

  NUM_SKILLS: 4
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID", "NAVIGATE"]
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_LR: 0.0005
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: null
  META_SWITCH_PENALTY: 0.0
  META_DEATH_PENALTY: 0.0
  META_REWARD_LAMBDA: 1.0

  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4

  TOTAL_TIMESTEPS: 30_000_000
  NUM_ENVS: 512
  NUM_STEPS: 64
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  LR: 0.00001
  SKILL_LR: 0.00001
  MAX_GRAD_NORM: 0.8

  SKILL_WARMUP_UPDATES: 200
  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  SKILL_BOOTSTRAP: "q_lambda"

  SKILL_EPS_START: 0.0
  SKILL_EPS_FINISH: 0.0
  SKILL_EPS_DECAY: 0.5
  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.5
