# experiment/freeway_fewshot.yaml
#
# Stage 2: finetune Seaquest skill heads on Freeway.
# Sparse hit-box overlap rewards only (COLLECT +1 / AVOID -1); no distance shaping.

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "freeway"
TRAIN_MODE: "skills_only"
META_ARCHITECTURE: "flat_mlp"

USE_LEGACY_EGO_OBS: false
# Ablation: use distance + direction only for transfer.
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
# Match seaquest_skills_pretrain when loading clip-trained checkpoints.
EGO_DISTANCE_CLIP_MAX_PX: 15

GAME_MODS: null
EVAL_GAME_MODS: null

SAVE_PATH: "./outputs/models/freeway_fewshot"

alg:
  # --- Transfer: load Seaquest skill Q-network weights ---
  INIT_MODEL_PATH: "./outputs/models/seaquest_skills_pretrain/seaquest/hierarchical_pqn_seaquest_seed44.safetensors"

  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 12
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  RESTRICT_FIRE_FOR_NON_DESTROY: false

  FIRST_FIRE: false
  STICKY_ACTIONS: false
  EPISODIC_LIFE: false
  FRAME_STACK_SIZE: 4

  # Shorter finetune horizon; lower LR than scratch.
  TOTAL_TIMESTEPS: 15_000_000
  NUM_ENVS: 512
  NUM_STEPS: 64

  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.00005
  MAX_GRAD_NORM: 0.8

  # Full off-policy relabel; sparse overlap rewards only (no distance shaping).
  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: false
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_LAMBDA: 0.65

  SYMBOLIC_COLLECT_FORCE_UP: false
  COLLECT_SKILL_INDEX: 1
  SYMBOLIC_COLLECT_UP_ACTION: 1

  # Less random re-exploration — weights already encode Seaquest skills.
  EPS_START: 0.25
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35

  HEURISTIC_MODE: "env_specific"

  AVOID_SURVIVAL_BONUS: 0.0

