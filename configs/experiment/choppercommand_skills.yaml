# experiment/choppercommand_skills.yaml

# --- Environment & Algorithm Names ---
ALG_NAME: "hierarchical_pqn"
ENV_NAME: "choppercommand"
TRAIN_MODE: "skills_only"

SAVE_PATH: "./outputs/models/choppercommand_skills"

USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
USE_EGO_WEAPON_FEATURES: true
EGO_DISTANCE_CLIP_MAX_PX: 20

# --- Environment modification hooks ---
# Training uses `GAME_MODS` (potentially phase-specific via curriculum),
# while evaluation can be given distinct `EVAL_GAME_MODS` so we can
# compare behavior under different env tweaks. If `EVAL_GAME_MODS` is
# null, eval inherits `GAME_MODS`.
GAME_MODS: null
EVAL_GAME_MODS: null

# Optional: ENV_SEED_BASE (default SEED) gives each of NUM_ENVS a distinct initial seed
# (ENV_SEED_BASE + env_id). Auto-reset on episode end uses fresh RNG for new episodes.

alg:
  # Training ChopperCommand skills **from scratch** (no INIT_MODEL_PATH).

  # --- Custom Architecture Dimensions ---
  NUM_SKILLS: 3               # DESTROY, COLLECT, AVOID
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]  # wandb keys: skill_DESTROY/td_loss, etc.
  MAX_OBJECTS: 85             # slot 0 = meta NOOP; up to 84 game objects
  EGO_ACTION_DIM: 18          # The 18 translated egocentric actions
  HIDDEN_SIZE: 128
  NUM_LAYERS: 2

  # If true, COLLECT and AVOID skills cannot choose FIRE ego actions.
  # Only the DESTROY skill (index 0) is allowed to fire.
  RESTRICT_FIRE_FOR_NON_DESTROY: false

  # --- Environment Wrappers ---
  # FIRST_FIRE: jaxatari AtariWrapper sends one FIRE immediately after each reset (ALE “start”).
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: True

  # --- PQN Rollout Hyperparameters ---
  # Scale: more NUM_ENVS = faster collection; keep (NUM_ENVS * NUM_STEPS) fixed so
  # NUM_UPDATES and minibatch size stay the same → same stability, faster wall-clock.
  TOTAL_TIMESTEPS: 100_000_000 # Total frames to train
  NUM_ENVS: 1024              # Parallel environments (was 512; 1024*64 = 512*128)
  NUM_STEPS: 64               # Steps per env per update (shorter rollouts balance more envs; batch = 65536)

  # --- PQN Update Hyperparameters ---
  NUM_EPOCHS: 3               # SGD epochs over rollout (2→3: more gradient steps per rollout, better sample use)
  NUM_MINIBATCHES: 64          # Must divide NUM_ENVS*NUM_STEPS; 65536/64 = 1024 minibatch (unchanged)
  GAMMA: 0.99                 # Discount factor
  LAMBDA: 0.65                # GAE / Lambda return smoothing parameter
  LR: 0.0001                  # Learning rate (2.5e-4 is standard for Atari)
  MAX_GRAD_NORM: 0.8          # Gradient clipping

  # --- Policy Style for Skill Updates ---
  OFF_POLICY: true            # If true, all skills learn from all transitions with a target.
                              # If false, use strict on-policy updates (only active skill learns).

  # --- Exploration (Epsilon-Greedy) ---
  EPS_START: 0.3              # Low skill exploration (easy concepts)
  EPS_FINISH: 0.05            # End at 5% random
  EPS_DECAY: 0.35            # Decay finishes at ~35% of training updates

  # --- Curriculum Learning over Skills ---
  # When enabled, TOTAL_TIMESTEPS will be split evenly across phases.
  # Put destroy first: aligns with needing FIRE to leave the no-move-start pause.
  # Training also sends FIRE when pause_timer is in that phase and there is no target.
  CURRICULUM_ENABLED: false
  CURRICULUM_PHASES: ["destroy", "collect", "avoid"]
  CURRICULUM_MODS:
    collect:
      - collect
    destroy:
      - destroy
    avoid:
      - avoid
