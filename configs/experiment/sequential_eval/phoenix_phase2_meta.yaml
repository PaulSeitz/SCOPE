# sequential_eval/phoenix_phase2_meta.yaml
# Phase 2: Tandem trainer, frozen skills (SKILL_LR=0), meta learns.

ALG_NAME: hierarchical_pqn
ENV_NAME: phoenix
TRAIN_MODE: tandem
META_ARCHITECTURE: per_object_mlp
SAVE_PATH: ./outputs/models/sequential_eval/phase2_meta
USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 20
GAME_MODS: null
EVAL_GAME_MODS: null
alg:
  INIT_MODEL_PATH: ./outputs/models/sequential_eval/phase1_skills/phoenix/hierarchical_pqn_phoenix_seed44.safetensors
  NUM_SKILLS: 3
  SKILL_NAMES:
  - DESTROY
  - COLLECT
  - AVOID
  MAX_OBJECTS: 21
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3
  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_LR: 0.0005
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: 0
  META_SWITCH_PENALTY: -0.05
  META_DEATH_PENALTY: -1.0
  META_REWARD_LAMBDA: 1.0
  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4
  TOTAL_TIMESTEPS: 30000000
  NUM_ENVS: 512
  NUM_STEPS: 64
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0
  MAX_GRAD_NORM: 0.8
  SKILL_GAMMA: 0.99
  SKILL_LAMBDA: 0.65
  SKILL_LR: 0
  OFF_POLICY: false
  RELABEL_ALL_OBJECTS: false
  SKILL_EPS_START: 0.0
  SKILL_EPS_FINISH: 0.0
  SKILL_EPS_DECAY: 0.5
  EPS_START: 0.5
  EPS_FINISH: 0.05
  EPS_DECAY: 0.5
