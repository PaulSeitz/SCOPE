# sequential_eval/seaquest_phase3_tandem.yaml
# Phase 3: Joint meta + skill finetune on Seaquest. Low SKILL_LR to prevent forgetting.
# TRAIN_MODE is overridable: set to "meta_only" to skip skill updates (run as Phase-2 variant).

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "seaquest"
TRAIN_MODE: "tandem"
META_ARCHITECTURE: "per_object_mlp"

SAVE_PATH: "./outputs/models/sequential_eval/phase3_tandem"

USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 20
USE_LEGACY_SEAQUEST_ACTION_MAPPER: false
USE_LEGACY_SEAQUEST_ASCENT_BLOCK: false
USE_LEGACY_SEAQUEST_SURFACING_DEATH_GUARD: false

GAME_MODS: null
EVAL_GAME_MODS: null

alg:
  # Filled in by orchestrator from Phase 2 output
  INIT_MODEL_PATH: ./outputs/models/sequential_eval/phase1_skills/seaquest/hierarchical_pqn_seaquest_seed44.safetensors

  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_LR: 0.0005
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: 0
  META_SWITCH_PENALTY: 0
  META_DEATH_PENALTY: 0.0
  META_REWARD_LAMBDA: 1.0

  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4

  TOTAL_TIMESTEPS: 10_000_000
  NUM_ENVS: 512
  NUM_STEPS: 64
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  # Low skill LR: meta adapts quickly, skills update gently to avoid forgetting.
  LR: 0.00001
  META_LR: 0.0005
  MAX_GRAD_NORM: 0.8

  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_QLAMBDA_WATKINS_CUT: false

  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.5
