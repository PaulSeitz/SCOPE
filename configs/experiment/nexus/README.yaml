# NEXUS comparison configs (symbolic_options / "From Objects to Skills")
#
# Alg YAMLs live in ``alg/`` and are synced into
# ``$NEXUS_ROOT/src/symbolic_options/config/alg/`` by ``scripts/run_nexus.py``.
#
# Quick start:
#   git submodule update --init --recursive third_party/symbolic_options
#   export NEXUS_ROOT=$PWD/third_party/symbolic_options
#   export JAXATARI_ROOT=/path/to/JAXAtari-seaquest-robustness
#   python scripts/run_nexus.py list-algs
#   python scripts/run_nexus.py train --alg cbl_seaquest_nexus_symbolic_paper --trial
#
# See docs/nexus_integration.md for HP tables and cluster notes.

