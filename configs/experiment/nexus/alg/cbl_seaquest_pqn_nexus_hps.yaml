# NEXUS flat PQN Seaquest baseline — HPs as shipped in pqn_jaxtari_sea1.yaml
# (paper Table 1 lists 1024/128 / max_grad=10 / ε 1→0.1@0.3; upstream Seaquest
# config uses 512/64, max_grad=0.5, ε 1→0.001@0.1). This file mirrors the
# *actual* sea1 config used for their PQN comparison runs.

NAME_INITIALS: "CBL"
ALG_NAME: "pqn"
TOTAL_TIMESTEPS: 5.0e7
TOTAL_TIMESTEPS_DECAY: 5.0e7
NUM_ENVS: 512
NUM_STEPS: 64
EPS_START: 1.0
EPS_FINISH: 0.001
EPS_DECAY: 0.1
META_EPS_START: 0.1
META_EPS_FINISH: 0.001
META_EPS_DECAY: 0.1
NUM_EPOCHS: 5
NUM_MINIBATCHES: 128
NORM_TYPE: "layer_norm"
NORM_INPUT: false
LR: 1.0e-4
MAX_GRAD_NORM: 0.5
LR_LINEAR_DECAY: false
GAMMA: 0.99
LAMBDA: 0.65
HIDDEN_SIZE: 64
NUM_LAYERS: 3
STICKY_ACTIONS: false
EPISODIC_LIFE: false

HIERARCHICAL: false
META_POLICY: "llm"
META_GREEDY: true
META_SHAPED_REWARD: false
LLM_PRETRAIN: false
RANDOM_PRETRAIN: false
PRETRAIN_LEN: 3700

ENV_NAME: "Seaquest"
ENV_KWARGS: {}
OBJECT_CENTRIC: true

TEST_DURING_TRAINING: true
TEST_INTERVAL: 0.1
TEST_NUM_ENVS: 1024
TEST_NUM_STEPS: 10000
EPS_TEST: 0.0
RECORD_VIDEO: true
eval_envs:
  - label: "clean"
    noisy_eval: false
    no_enemies: false
  - label: "mod"
    no_enemies: true
    noisy_eval: false
