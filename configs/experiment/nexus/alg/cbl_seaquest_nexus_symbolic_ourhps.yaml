# NEXUS symbolic Seaquest with ConceptBasedLearning skill/tandem HPs
# (see configs/experiment/paper_eval/rq1/seaquest_skills_ego.yaml).
# Same NEXUS architecture (3 OC options + LLM meta), different optimizer schedule.

NAME_INITIALS: "CBL"
ALG_NAME: "pqn_hier_llm"
TOTAL_TIMESTEPS: 24985600
TOTAL_TIMESTEPS_DECAY: 24985600
NUM_ENVS: 128
NUM_STEPS: 128
EPS_START: 0.2
EPS_FINISH: 0.01
EPS_DECAY: 0.2
META_EPS_START: 0.2
META_EPS_FINISH: 0.01
META_EPS_DECAY: 0.2
NUM_EPOCHS: 4
NUM_MINIBATCHES: 64
NORM_TYPE: "layer_norm"
NORM_INPUT: false
LR: 5.0e-4
MAX_GRAD_NORM: 0.8
LR_LINEAR_DECAY: false
GAMMA: 0.99
LAMBDA: 0.65
META_LAMBDA: 0.9
HIDDEN_SIZE: 128
NUM_LAYERS: 3
STICKY_ACTIONS: false
EPISODIC_LIFE: true

HIERARCHICAL: true
NUM_AGENTS: 3
META_POLICY: "llm"
META_GREEDY: false
META_SHAPED_REWARD: false
LLM_PRETRAIN: false
RANDOM_PRETRAIN: false
PRETRAIN_LEN: 3700
NO_REWARDS: false

ENV_NAME: "Seaquest"
ENV_KWARGS: {}
OBJECT_CENTRIC: true

TEST_DURING_TRAINING: true
TEST_INTERVAL: 0.1
TEST_NUM_ENVS: 128
TEST_NUM_STEPS: 10000
EPS_TEST: 0.0
RECORD_VIDEO: true
eval_envs:
  - label: "clean"
    noisy_eval: false
    no_enemies: false
  - label: "mod"
    no_enemies: true
    noisy_eval: false
