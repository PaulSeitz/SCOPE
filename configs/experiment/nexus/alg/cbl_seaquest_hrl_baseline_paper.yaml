# NEXUS HPQN / HRL baseline (paper: hierarchical PQN without skill rewards,
# learned meta). Mirrors pqn_jaxtari_sea2_hier_baseline.yaml.

NAME_INITIALS: "CBL"
ALG_NAME: "pqn_hier_baseline"
TOTAL_TIMESTEPS: 5.0e7
TOTAL_TIMESTEPS_DECAY: 5.0e7
NUM_ENVS: 1024
NUM_STEPS: 128
EPS_START: 1.0
EPS_FINISH: 0.001
EPS_DECAY: 0.1
META_EPS_START: 0.1
META_EPS_FINISH: 0.001
META_EPS_DECAY: 0.3
NUM_EPOCHS: 5
NUM_MINIBATCHES: 128
NORM_TYPE: "layer_norm"
NORM_INPUT: false
LR: 1.0e-4
MAX_GRAD_NORM: 10
LR_LINEAR_DECAY: false
GAMMA: 0.99
LAMBDA: 0.5
META_LAMBDA: 0.9
HIDDEN_SIZE: 64
NUM_LAYERS: 3
STICKY_ACTIONS: false
EPISODIC_LIFE: false

# CRITICAL: all options share env reward only (no skill-specific shaping).
NO_REWARDS: true

HIERARCHICAL: true
NUM_AGENTS: 3
META_POLICY: "learned"
META_GREEDY: false
META_SHAPED_REWARD: false
LLM_PRETRAIN: false
RANDOM_PRETRAIN: false
PRETRAIN_LEN: 3700

ENV_NAME: "Seaquest"
ENV_KWARGS: {}
OBJECT_CENTRIC: true

TEST_DURING_TRAINING: true
TEST_INTERVAL: 0.1
TEST_NUM_ENVS: 1024
TEST_NUM_STEPS: 10000
EPS_TEST: 0.0
RECORD_VIDEO: true
eval_envs:
  - label: "clean"
    noisy_eval: false
    no_enemies: false
  - label: "mod"
    no_enemies: true
    noisy_eval: false
