ALG_NAME: "hierarchical_pqn_step3_meta"
ENV_NAME: "seaquest"
TRAIN_MODE: "meta_only"

GAME_MODS: null
EVAL_GAME_MODS: null

# Path to the skill checkpoint saved by step 1.
# Replace with the actual output path after step 1 completes.
INIT_MODEL_PATH: "./outputs/models/seaquest/hierarchical_pqn_step1_skills_seaquest_seed0.safetensors"

alg:
  # Architecture — must be identical to step 1 so checkpointed params load cleanly
  NUM_SKILLS: 4
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID", "NAVIGATE"]
  MAX_OBJECTS: 35
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  # Meta head
  META_HIDDEN_SIZE: 256
  META_LR: 0.00005
  LR: 0.00005   # fallback

  # Environment wrappers — must match step 1
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FRAME_STACK_SIZE: 4

  # Rollout/update settings
  # NUM_UPDATES = 10M / 64 / 256 = 610
  TOTAL_TIMESTEPS: 10_000_000
  NUM_ENVS: 256
  NUM_STEPS: 64
  NUM_EPOCHS: 2
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  LAMBDA: 0.65
  MAX_GRAD_NORM: 0.8

  # Meta exploration — in meta_only there is no warmup phase, meta learns from step 0.
  # Decay over 80% of updates (488 of 610) so meta is still exploring well into training.
  META_EPS_START: 1.0
  META_EPS_FINISH: 0.05
  META_EPS_DECAY: 0.8

  # Skill epsilon: skills are frozen in meta_only, but the eps value is still used
  # to select ego actions. Keep it low so skills execute greedily — we want to
  # evaluate the skills as trained, not add extra noise on top.
  EPS_START: 0.05
  EPS_FINISH: 0.05
  EPS_DECAY: 1.0

  # Reward shaping for meta
  META_SWITCH_PENALTY: -0.005
  META_DEATH_PENALTY: -5.0

  # Off-policy flag is read by the skill update path; irrelevant when skills are frozen
  # but keep it consistent with other configs
  OFF_POLICY: true

  # Not used in meta_only but keep for config diff readability
  HEURISTIC_MODE: "nearest"

  SAVE_PATH: "./outputs/models"
