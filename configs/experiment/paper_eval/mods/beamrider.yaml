# Beamrider mod allowlists for paper_eval RQ2.
env: beamrider
status: ready

eval_mods:
  - key: base
    mods: []
    category: control
  - key: double_enemy_speed
    mods: [double_enemy_speed]
    category: dynamics
    skip_eval: true  # JAXAtari API drift vs base beamrider (occupied_lanes)
  - key: fog_of_war
    mods: [fog_of_war]
    category: dynamics
    skip_eval: true  # fog palette missing under native downscale
  - key: hardcore
    mods: [hardcore]
    category: dynamics
  - key: mothership_laser
    mods: [mothership_laser]
    category: semantic
  - key: same_enemies
    mods: [same_enemies]
    category: semantic
  - key: teleport_ufos
    mods: [teleport_ufos]
    category: dynamics
  - key: three_lanes
    mods: [three_lanes]
    category: dynamics
  - key: toaster
    mods: [toaster]
    category: visual

paper_core:
  - base
  # double_enemy_speed / fog_of_war skipped — see skip_eval on those entries
  - hardcore
  - mothership_laser
  - teleport_ufos
  - three_lanes
  - toaster  # one visual
