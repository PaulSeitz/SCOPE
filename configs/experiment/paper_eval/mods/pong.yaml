# Pong mod allowlists for paper_eval RQ2.
env: pong
status: ready

eval_mods:
  - key: base
    mods: []
    category: control
  - key: lazy_enemy
    mods: [lazy_enemy]
    category: dynamics
  - key: random_enemy
    mods: [random_enemy]
    category: dynamics
  - key: linear_movement
    mods: [linear_movement]
    category: dynamics
  - key: shift_player
    mods: [shift_player]
    category: dynamics
  - key: shift_enemy
    mods: [shift_enemy]
    category: dynamics
  - key: no_fire
    mods: [no_fire]
    category: semantic
  - key: zero_score
    mods: [zero_score]
    category: semantic
  # one visual-ish (palette); kept for pixel-stress, not primary table
  - key: change_background_color
    mods: [change_background_color]
    category: visual
  - key: change_player_color
    mods: [change_player_color]
    category: visual

paper_core:
  - base
  - lazy_enemy
  - random_enemy
  - linear_movement
  - shift_player
  - shift_enemy
  - no_fire
