# paper_eval/rq1/seaquest_pqn_oc.yaml
# Flat PQN object-centric baseline — matched frame budget to RQ1 skill arms.
# Added because pixel PQN is surprisingly strong; OC is the fairer "structured
# observation" control for the hierarchical OC skill arm.

PAPER_EVAL_RQ: 1
PAPER_EVAL_PHASE: train
PAPER_EVAL_KIND: flat_pqn
PAPER_EVAL_MODS: seaquest
NUM_SEEDS: 1

ALG_NAME: flat_pqn
ENV_NAME: seaquest
TRAIN_MODE: flat_pqn
OBJECT_CENTRIC: true
NORM_TYPE: layer_norm
NORM_INPUT: false
LR_LINEAR_DECAY: false
SAVE_PATH: ./outputs/models/paper_eval/rq1/seaquest_pqn_oc
WANDB_RUN_NAME: sq_paper_rq1_pqn_oc
WANDB_TAGS:
- suite:paper_eval
- rq:1
- env:seaquest
- train_mode:flat_pqn
- variant:pqn_oc_matched_skip4
- skill_input:oc  # observational parity tag (flat OC, not hierarchical)

TOTAL_TIMESTEPS: 24985600
TOTAL_TIMESTEPS_DECAY: 24985600
NUM_ENVS: 128
NUM_STEPS: 128
NUM_EPOCHS: 4
NUM_MINIBATCHES: 64
FRAME_SKIP: 4
FRAME_STACK_SIZE: 4
FIRST_FIRE: true
STICKY_ACTIONS: false
EPISODIC_LIFE: true
CLIP_REWARD: true
GAMMA: 0.99
LAMBDA: 0.65
LR: 0.0001
MAX_GRAD_NORM: 0.8
HIDDEN_SIZE: 128
NUM_LAYERS: 2
EPS_START: 0.2
EPS_FINISH: 0.01
EPS_DECAY: 0.2
GAME_MODS: null
EVAL_GAME_MODS: null
