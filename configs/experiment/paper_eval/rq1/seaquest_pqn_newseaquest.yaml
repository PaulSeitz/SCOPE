# Flat PQN pixel baseline retrained on post-spawn-fix Seaquest
# (JAXAtari-seaquest-robustness). Fresh SAVE_PATH so it cannot reuse old RQ1 ckpts.
# Algorithm HPs = PQN paper Table 5; budget matched to RQ1 skill arms (~25M steps).

PAPER_EVAL_RQ: 1
PAPER_EVAL_PHASE: train
PAPER_EVAL_KIND: flat_pqn
PAPER_EVAL_MODS: seaquest
NUM_SEEDS: 1

ALG_NAME: flat_pqn
ENV_NAME: seaquest
TRAIN_MODE: flat_pqn
OBJECT_CENTRIC: false
PIXEL_RESIZE: true
PIXEL_RESIZE_SHAPE: [84, 84]
PIXEL_GRAYSCALE: true
USE_NATIVE_DOWNSCALING: true
NORM_TYPE: layer_norm
NORM_INPUT: false
LR_LINEAR_DECAY: false
SAVE_PATH: ./outputs/models/paper_eval/rq1/seaquest_pqn_newseaquest
WANDB_RUN_NAME: sq_paper_rq1_pqn_pixel_newseaquest
WANDB_TAGS:
- suite:newseaquest_spawnfix
- rq:1
- env:seaquest
- train_mode:flat_pqn
- variant:pqn_pixel_paper_hps
- probe:newseaquest_spawnfix

TOTAL_TIMESTEPS: 24985600
TOTAL_TIMESTEPS_DECAY: 24985600
NUM_ENVS: 128
NUM_STEPS: 32
NUM_EPOCHS: 2
NUM_MINIBATCHES: 32
FRAME_SKIP: 4
FRAME_STACK_SIZE: 4
FIRST_FIRE: true
STICKY_ACTIONS: false
EPISODIC_LIFE: true
CLIP_REWARD: true
GAMMA: 0.99
LAMBDA: 0.65
LR: 0.00025
MAX_GRAD_NORM: 10
HIDDEN_SIZE: 128
NUM_LAYERS: 2
EPS_START: 1.0
EPS_FINISH: 0.001
EPS_DECAY: 0.1
GAME_MODS: null
EVAL_GAME_MODS: null
SEED: 44
