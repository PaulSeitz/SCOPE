# paper_eval/rq1/seaquest_heuristic_random.yaml
# Eval-only: env heuristic + randomly initialized skills (architecture lower bound).

PAPER_EVAL_RQ: 1
PAPER_EVAL_PHASE: eval
PAPER_EVAL_KIND: heuristic_random
PAPER_EVAL_MODS: seaquest
PAPER_EVAL_ARCHITECTURE_OF: seaquest_skills_ego
PAPER_EVAL_REQUIRES_RQ1: []
NUM_SEEDS: 1

ALG_NAME: hierarchical_pqn
TRAIN_MODE: skills_only
ENV_NAME: seaquest
SAVE_PATH: ./outputs/models/paper_eval/rq1/seaquest_heuristic_random
WANDB_RUN_NAME: sq_paper_rq1_heuristic_random
WANDB_TAGS:
- suite:paper_eval
- rq:1
- env:seaquest
- train_mode:eval_only
- skill_input:ego
- variant:heuristic_random_skills

USE_LEGACY_EGO_OBS: false
