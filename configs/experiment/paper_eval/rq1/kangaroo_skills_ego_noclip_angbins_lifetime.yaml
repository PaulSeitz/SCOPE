# paper_eval/rq1/kangaroo_skills_ego_noclip_angbins_lifetime.yaml
# Kangaroo skills probe: 8θ-bins ego, distance clip off (default SKILL_TARGET_CUT=global).
# 3 skills (DESTROY / COLLECT / AVOID): ladder waypoints + fruits are COLLECT.
#
# Kangaroo deltas vs Seaquest: MAX_OBJECTS=55, FIRST_FIRE=false, no Seaquest legacy flags.
# NOTE: 55-object ego @ 128 envs may OOM — drop NUM_ENVS to 64 if needed.

