- suite:paper_eval
- rq:1
- env:kangaroo
- train_mode:skills_only
- skill_input:ego
- variant:skills_ego_skip4
- ego:blocking
- ego:weapon
- ablation:collect_death
- ablation:lr_decay
- destroy:contact_fail
- destroy:living_penalty
- probe:noclip_angbins
