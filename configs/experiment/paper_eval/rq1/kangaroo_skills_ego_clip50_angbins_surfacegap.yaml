# Kangaroo retrain: Seaquest-proven clip50 + 8 world-θ bins ego, with AABB
# surface-gap approach shaping (skill_rewards._approach_distances).
# Same recipe as seaquest_skills_ego_clip50_angbins — use to debug Kangaroo issues
# against a known-working Seaquest spine (not facing-φ8).
#
# Kangaroo deltas vs Seaquest: MAX_OBJECTS=55, FIRST_FIRE=false, 3 skills (no NAVIGATE),
# SKILL_DEATH_PENALIZE_COLLECT=false. Waypoint width matched to player stand width
# in kangaroo_label.py for COLLECT overlap.
# NOTE: 55-object ego @ 128 envs may OOM — drop NUM_ENVS to 64 if needed.
#
# 2-GPU (kangaroo + Seaquest navigatesurface_surfacegap in parallel):
#   python scripts/run_paper_eval.py --suite surfacegap_dual --gpus 0,1 --wait-deps --lean
# Kangaroo only:
#   python scripts/run_paper_eval.py --suite kangaroo_surfacegap --gpus 0 --wait-deps --lean

PAPER_EVAL_RQ: 1
PAPER_EVAL_PHASE: train
PAPER_EVAL_KIND: skills
PAPER_EVAL_MODS: kangaroo
NUM_SEEDS: 1
ALG_NAME: hierarchical_pqn
TRAIN_MODE: skills_only
USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
USE_EGO_BLOCKING_FEATURES: true
USE_EGO_WEAPON_FEATURES: true
USE_EGO_SHOT_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 50
EGO_ANGLE_BINS: 8
GAME_MODS: null
EVAL_GAME_MODS: null
ENV_NAME: kangaroo
SAVE_PATH: ./outputs/models/paper_eval/rq1/kangaroo_skills_ego_clip50_angbins_surfacegap
WANDB_RUN_NAME: kg_paper_rq1_skills_ego_clip50_angbins_surfacegap
WANDB_TAGS:
- suite:kangaroo_surfacegap
- rq:1
- env:kangaroo
- train_mode:skills_only
- skill_input:ego
- variant:skills_ego_skip4
- ego:blocking
- ego:weapon
- ego:clip50
- ego:angbins8
- reward:surface_gap
- destroy:contact_fail
- destroy:living_penalty
- probe:kangaroo_25m
SKILL_INPUT_MODE: ego
SKILL_DEATH_PENALIZE_COLLECT: false
RECORD_VIDEO: false
VIDEO_AT_END: false
VIDEO_MAX_FRAMES: 600
VIDEO_FRAME_STRIDE: 4
DESTROY_CONTACT_FAIL: true
DESTROY_LIVING_PENALTY: true
alg:
  NUM_SKILLS: 3
  SKILL_NAMES:
  - DESTROY
  - COLLECT
  - AVOID
  MAX_OBJECTS: 55
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3
  SKILL_EMBED_DIM: 256
  SKILL_LR: 0.0005
  SKILL_LR_FINISH: 0.0001
  SKILL_LR_DECAY: 0.5
  SKILL_REWARD_LAMBDA: 0.0
  CLIP_REWARD: true
  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: false
  STICKY_ACTIONS: false
  EPISODIC_LIFE: true
  FRAME_STACK_SIZE: 4
  FRAME_SKIP: 4
  TOTAL_TIMESTEPS: 24985600
  NUM_ENVS: 128
  NUM_STEPS: 128
  NUM_EPOCHS: 4
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  SKILL_LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8
  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: false
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: q_lambda
  EPS_START: 0.2
  EPS_FINISH: 0.01
  EPS_DECAY: 0.2
  HEURISTIC_MODE: env_specific
  SKILL_INPUT_MODE: ego
  SKILL_DEATH_PENALIZE_COLLECT: false
  DESTROY_CONTACT_FAIL: true
  DESTROY_LIVING_PENALTY: true
  USE_EGO_SHOT_FEATURES: false
