# Kangaroo retrain after heuristic coco/fruit fixes.
# Recipe = Seaquest navigatesurface_surfacegap spine (not centres):
#   seaquest_skills_ego_pov_clip50_facing_psibins8_navigatesurface_surfacegap
# (POV facing, ψ-bins8, clip50, default surface-gap AABB geom) with Kangaroo deltas:
#   3 skills (no NAVIGATE), MAX_OBJECTS=55, FIRST_FIRE=false,
#   SKILL_DEATH_PENALIZE_COLLECT=false.
#
# Cluster:
#   python scripts/run_paper_eval.py --suite kangaroo_facing_surfacegap --gpus 0 --wait-deps --lean
# Or single config:
#   python main.py --config-name experiment/paper_eval/rq1/kangaroo_skills_ego_pov_clip50_facing_psibins8_surfacegap

PAPER_EVAL_RQ: 1
PAPER_EVAL_PHASE: train
PAPER_EVAL_KIND: skills
PAPER_EVAL_MODS: kangaroo
NUM_SEEDS: 1
ALG_NAME: hierarchical_pqn
TRAIN_MODE: skills_only
USE_POV_RELATIVE_MAPPER: true
USE_POV_FIXED_BILATERAL: false
USE_POV_FACING_FRAME: true
EGO_POSE_XY: false
USE_LEGACY_EGO_OBS: false
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
USE_EGO_BLOCKING_FEATURES: true
USE_EGO_WEAPON_FEATURES: true
USE_EGO_SHOT_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 50
EGO_ANGLE_BINS: null
EGO_PSI_ANGLE_BINS: 8
GAME_MODS: null
EVAL_GAME_MODS: null
ENV_NAME: kangaroo
SAVE_PATH: ./outputs/models/paper_eval/rq1/kangaroo_skills_ego_pov_clip50_facing_psibins8_surfacegap
WANDB_RUN_NAME: kg_paper_rq1_skills_ego_pov_clip50_facing_psibins8_surfacegap
WANDB_TAGS:
- suite:kangaroo_facing_surfacegap
- rq:1
- env:kangaroo
- train_mode:skills_only
- skill_input:ego
- mapper:pov_facing
- ego:phi_bins8
- ego:blocking
- ego:weapon
- ego:clip50
- reward:surface_gap
- destroy:contact_fail
- destroy:living_penalty
- probe:kangaroo_heuristic_retrain
SKILL_INPUT_MODE: ego
SKILL_DEATH_PENALIZE_COLLECT: false
RECORD_VIDEO: false
VIDEO_AT_END: false
VIDEO_MAX_FRAMES: 600
VIDEO_FRAME_STRIDE: 4
DESTROY_CONTACT_FAIL: true
DESTROY_LIVING_PENALTY: true
USE_EGO_SHOT_FEATURES: false
