budget_tag: 50m_optim
total_timesteps: 50000000
num_envs: 1024
num_steps: 32
num_updates: 1525
num_epochs: 2
num_minibatches: 256
lr: 0.00025
lr_linear_decay: true
max_grad_norm: 10.0
eps: 1.0 -> 0.001 (decay=0.1)
seeds: [44, 45, 46]
