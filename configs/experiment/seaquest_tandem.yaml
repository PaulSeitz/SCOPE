# experiment/seaquest_tandem.yaml

# --- Environment & Algorithm Names ---
ALG_NAME: "hierarchical_pqn"
ENV_NAME: "seaquest"
TRAIN_MODE: "tandem"
META_ARCHITECTURE: "flat_mlp"
USE_LEGACY_EGO_OBS: false
# Aligned with seaquest_skills_pretrain (distance + direction only).
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 20
USE_LEGACY_SEAQUEST_ACTION_MAPPER: false
USE_LEGACY_SEAQUEST_ASCENT_BLOCK: false
USE_LEGACY_SEAQUEST_SURFACING_DEATH_GUARD: false

# --- Environment modification hooks ---
# Tandem currently runs directly on the configured env (no curriculum staging).
# Training uses `GAME_MODS` (potentially phase-specific via curriculum),
# while evaluation can be given distinct `EVAL_GAME_MODS` so we can
# compare behavior under different env tweaks. If `EVAL_GAME_MODS` is
# null, eval inherits `GAME_MODS`.
GAME_MODS: null
EVAL_GAME_MODS: null

# Optional: ENV_SEED_BASE (default SEED) gives each of NUM_ENVS a distinct initial seed
# (ENV_SEED_BASE + env_id). Auto-reset on episode end uses fresh RNG for new episodes.

alg:
  # --- Custom Architecture Dimensions ---
  NUM_SKILLS: 4               # DESTROY, COLLECT, AVOID, NAVIGATE
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID", "NAVIGATE"]  # wandb keys: skill_DESTROY/td_loss, etc.
  MAX_OBJECTS: 35             # slot 0 = meta NOOP; 33 game + 1 surface waypoint
  EGO_ACTION_DIM: 18          # The 18 translated egocentric actions
  HIDDEN_SIZE: 128            # Slightly wider since it relies purely on distance/angle
  NUM_LAYERS: 3

  # If true, COLLECT and AVOID skills cannot choose FIRE ego actions.
  # Only the DESTROY skill (index 0) is allowed to fire.
  RESTRICT_FIRE_FOR_NON_DESTROY: false

  # --- Meta head (tandem only) ---
  META_HIDDEN_SIZE: 256
  META_PER_OBJECT_NUM_LAYERS: 3
  META_FLAT_NUM_LAYERS: 3
  META_LR: 0.0005
  META_SWITCH_PENALTY: -0.05
  META_DEATH_PENALTY: 0.0
  # Learnable NOOP: meta selects slot 0 (reserved; not a game entity).
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: null
  
  
  META_REWARD_LAMBDA: 1.0

  # --- Skill reward blending ---
  # Controls what signal skill policies train on (independent of META_REWARD_LAMBDA):
  #   0.0 → full skill reward (default; sparse concept rewards only)
  #   1.0 → full environment reward (sign-clipped) on every skill training step
  #   0.0–1.0 → linear blend of both
  # SKILL_REWARD_LAMBDA: 0.0

  # Skill optimizer (if omitted, LR is used) — match seaquest_skills_pretrain
  SKILL_LR: 0.0005

  # --- Environment Wrappers ---
  # FIRST_FIRE: jaxatari AtariWrapper sends one FIRE immediately after each reset (ALE “start”).
  FIRST_FIRE: true
  STICKY_ACTIONS: false
  EPISODIC_LIFE: True
  FRAME_STACK_SIZE: 4

  # --- PQN Rollout Hyperparameters (skills: seaquest_skills_pretrain) ---
  TOTAL_TIMESTEPS: 100_000_000 # Total frames to train (tandem run length)
  NUM_ENVS: 2048
  NUM_STEPS: 32

  # --- PQN Update Hyperparameters ---
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 64
  GAMMA: 0.99
  SKILL_GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.0001                  # Fallback LR (skills; meta uses META_LR)
  MAX_GRAD_NORM: 0.8

  # --- Policy Style for Skill Updates (seaquest_skills_pretrain) ---
  OFF_POLICY: true
  RELABEL_ALL_OBJECTS: true
  RELABEL_K_OBJECTS: null
  SKILL_BOOTSTRAP: "q_lambda"
  SKILL_LAMBDA: 0.65

  # --- Exploration (Epsilon-Greedy) ---
  EPS_START: 0.3
  EPS_FINISH: 0.05
  EPS_DECAY: 0.35
  META_EPS_START: 0.1

  # --- Epochs (tandem only) ---
  # META_NUM_EPOCHS overrides NUM_EPOCHS for the meta update loop only.
  # Increase once skills converge to get more meta gradient steps per rollout.
  META_NUM_EPOCHS: 3

  # --- Skill freezing (tandem only) ---
  # Stop updating skills after this many update steps (0 = never freeze).
  # Set to ~10% of NUM_UPDATES once you confirm skills converge early.
  SKILL_FREEZE_AFTER_UPDATES: 0

  # --- Warmup (tandem only) ---
  # Use env-specific Seaquest heuristic for target selection while meta is frozen.
  HEURISTIC_MODE: "env_specific"
  SKILL_WARMUP_UPDATES: 0
  META_LEARN_DURING_WARMUP: false
