# experiment/freeway_meta_only.yaml
#
# Stage 3: train a meta policy on frozen Freeway skills (no heuristic).
# Run experiment=freeway_fewshot first, then point INIT_MODEL_PATH at its output.

ALG_NAME: "hierarchical_pqn"
ENV_NAME: "freeway"
TRAIN_MODE: "meta_only"
META_ARCHITECTURE: "flat_mlp"

USE_LEGACY_EGO_OBS: false
# Must match freeway_fewshot / the skill checkpoint.
USE_EGO_SIZE_FEATURES: false
USE_EGO_VELOCITY_FEATURES: false
EGO_DISTANCE_CLIP_MAX_PX: 15

GAME_MODS: null
EVAL_GAME_MODS: null

SAVE_PATH: "./outputs/models/freeway_meta_only"

alg:
  # Freeway-finetuned skills from freeway_fewshot (same ego layout as that run).
  # Filename: {SAVE_PATH}/{ENV_NAME}/{ALG_NAME}_{ENV_NAME}_seed{SEED}.safetensors
  INIT_MODEL_PATH: "./outputs/models/seaquest_skills_pretrain/seaquest/hierarchical_pqn_seaquest_seed44.safetensors"

  NUM_SKILLS: 3
  SKILL_NAMES: ["DESTROY", "COLLECT", "AVOID"]
  MAX_OBJECTS: 12
  EGO_ACTION_DIM: 18
  HIDDEN_SIZE: 128
  NUM_LAYERS: 3

  META_HIDDEN_SIZE: 256
  META_FLAT_NUM_LAYERS: 3
  META_LR: 0.0005
  META_SWITCH_PENALTY: 0
  META_DEATH_PENALTY: -1.0
  # Freeway tandem disables NOOP target; meta picks cars or the top COLLECT goal.
  META_USE_NOOP_TARGET: true
  META_NOOP_TARGET_IDX: 0

  RESTRICT_FIRE_FOR_NON_DESTROY: false
  FIRST_FIRE: false
  STICKY_ACTIONS: false
  EPISODIC_LIFE: false
  FRAME_STACK_SIZE: 4

  TOTAL_TIMESTEPS: 20_000_000
  NUM_ENVS: 512
  NUM_STEPS: 64
  NUM_EPOCHS: 3
  NUM_MINIBATCHES: 32
  GAMMA: 0.99
  LAMBDA: 0.65
  LR: 0.0001
  MAX_GRAD_NORM: 0.8

  # Meta target exploration (train_meta_agent uses EPS_* for the meta head).
  EPS_START: 0.25
  EPS_FINISH: 0.05
  EPS_DECAY: 0.5

  # Skills are frozen; keep skill-action noise low.
  # (Not used for target selection in meta_only — meta network chooses targets.)
